<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>RIP CITY — Sports Card Pack Simulator</title>
<style>
  :root{
    --bg:#0a0e17; --bg2:#121826; --panel:#161d2e; --line:#27314a;
    --fg:#e8ecf5; --dim:#8b97b3; --accent:#ffcb3d; --good:#39d98a; --bad:#ff5d6c;
    --gold:#ffcb3d;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1b2740 0%, transparent 60%),
      var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-text-size-adjust:100%;
  }
  .wrap{ max-width:1040px; margin:0 auto; padding:16px 16px 60px; }

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; margin-bottom:14px;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand h1{
    font-size:26px; margin:0; letter-spacing:2px; font-weight:900;
    background:linear-gradient(90deg,#ffcb3d,#ff6ec7,#5ad1ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand .tag{ color:var(--dim); font-size:12px; letter-spacing:1px; text-transform:uppercase; }

  .wallet{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  }
  .stat{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:7px 11px; font-size:13px; line-height:1.1; min-width:74px;
  }
  .stat b{ display:block; font-size:16px; margin-top:3px; }
  .stat small{ color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .net.pos b{ color:var(--good); } .net.neg b{ color:var(--bad); }

  button{
    font-family:inherit; cursor:pointer; border-radius:10px;
    border:1px solid var(--line); background:var(--panel); color:var(--fg);
    padding:10px 14px; font-size:14px; font-weight:600;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
  }
  button:hover{ border-color:var(--accent); }
  button:active{ transform:translateY(1px); }
  button.primary{ background:linear-gradient(180deg,#ffd95e,#f5a623); color:#1a1300; border:none; font-weight:800; }
  button.ghost{ background:transparent; }
  button:disabled{ opacity:.45; cursor:not-allowed; }

  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }

  /* Product grid */
  .sport-group{ margin-bottom:20px; }
  .sport-group h2{
    font-size:14px; letter-spacing:2px; text-transform:uppercase; color:var(--dim);
    border-bottom:1px solid var(--line); padding-bottom:6px; margin:0 0 12px;
  }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .product{
    position:relative; border:1px solid var(--line); border-radius:14px; padding:14px;
    background:linear-gradient(160deg,var(--bg2),var(--panel));
    overflow:hidden; cursor:pointer; transition:transform .12s ease, border-color .12s ease;
  }
  .product:hover{ transform:translateY(-3px); border-color:var(--accent); }
  .product .sheen{ position:absolute; inset:0; background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%); pointer-events:none; }
  .product .yr{ font-size:11px; color:var(--dim); letter-spacing:1px; }
  .product h3{ margin:4px 0 2px; font-size:18px; }
  .product .meta{ font-size:12px; color:var(--dim); margin-top:8px; display:flex; justify-content:space-between; }
  .product .price{ color:var(--accent); font-weight:800; }
  .product .stripe{ height:5px; border-radius:4px; margin-top:10px; }

  /* Opening view */
  .opener{ }
  .opener-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .opener-head .ptitle h2{ margin:0; font-size:22px; }
  .opener-head .ptitle .sub{ color:var(--dim); font-size:13px; }

  .packstage{
    border:1px solid var(--line); border-radius:16px; padding:22px;
    background:radial-gradient(700px 300px at 50% 0%, #1c2742, var(--bg2));
    min-height:360px;
  }

  /* Pack art */
  .packart{
    width:200px; height:300px; margin:10px auto 18px; border-radius:14px;
    position:relative; cursor:pointer; user-select:none;
    box-shadow:0 18px 40px rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:18px 14px; text-align:center; overflow:hidden;
    transition:transform .15s ease;
  }
  .packart:hover{ transform:translateY(-4px) rotate(-1deg); }
  .packart .foilshine{ position:absolute; inset:0; background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%); mix-blend-mode:screen; animation:shine 3s linear infinite; }
  @keyframes shine{ 0%{ transform:translateX(-60%);} 100%{ transform:translateX(60%);} }
  .packart .pbrand{ font-weight:900; font-size:22px; letter-spacing:1px; text-shadow:0 2px 6px rgba(0,0,0,.6); }
  .packart .psport{ font-size:12px; letter-spacing:3px; text-transform:uppercase; opacity:.9; }
  .packart .ptap{ font-size:12px; background:rgba(0,0,0,.35); padding:5px 10px; border-radius:20px; }

  .ripcontrols{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  /* Card reveal area */
  .reveal{ display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:12px; margin-top:6px; }
  .card{
    position:relative; aspect-ratio:5/7; border-radius:10px; cursor:pointer;
    perspective:800px; background:transparent;
  }
  .card .inner{ position:absolute; inset:0; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.2,.8,.2,1); }
  .card.flipped .inner{ transform:rotateY(180deg); }
  .card .face{ position:absolute; inset:0; border-radius:10px; backface-visibility:hidden; overflow:hidden; }
  .card .back{
    background:
      repeating-linear-gradient(45deg,#1d2742 0 10px,#222e4d 10px 20px);
    border:2px solid #2c3a5e;
    display:flex; align-items:center; justify-content:center;
  }
  .card .back span{ font-weight:900; letter-spacing:2px; color:#5b6b96; transform:rotate(-12deg); font-size:18px; }
  .card .front{
    transform:rotateY(180deg);
    border:2px solid var(--line);
    display:flex; flex-direction:column; padding:8px; color:#fff;
    background:linear-gradient(160deg,#202a44,#161d2e);
  }
  .card .front .photo{
    position:absolute; inset:0; background-color:#0e1424;
    background-size:cover; background-position:center 16%; background-repeat:no-repeat;
    display:flex; align-items:center; justify-content:center;
  }
  .card .front .photo .initials{ font-size:32px; font-weight:800; color:#36456a; letter-spacing:1px; }
  .photo.has-img .initials, .clthumb.has-img span{ display:none; }
  .card .front .shade{
    position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(10,14,23,.02) 30%, rgba(10,14,23,.45) 60%, rgba(10,14,23,.92) 100%);
  }
  .card .front .info{ position:relative; z-index:2; margin-top:auto; }
  .card .front .pos{ font-size:9px; letter-spacing:1px; opacity:.9; text-transform:uppercase; text-shadow:0 1px 3px rgba(0,0,0,.8); }
  .card .front .nm{ font-weight:800; font-size:14px; line-height:1.05; text-shadow:0 1px 4px rgba(0,0,0,.9); }
  .card .front .tm{ font-size:10px; opacity:.9; text-shadow:0 1px 3px rgba(0,0,0,.8); }
  .card .front .rar{ font-size:9px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; margin-top:5px; padding:2px 5px; border-radius:5px; display:inline-block; align-self:flex-start; }
  .card .front .serial{ position:absolute; z-index:3; top:6px; right:7px; font-size:10px; font-weight:800; background:rgba(0,0,0,.6); padding:2px 6px; border-radius:20px; }
  .card .front .setline{ position:absolute; z-index:3; top:6px; left:7px; font-size:8px; font-weight:600; background:rgba(0,0,0,.5); padding:2px 5px; border-radius:5px; letter-spacing:.5px; }
  .card.holo .front::after{
    content:""; position:absolute; inset:0; pointer-events:none; mix-blend-mode:color-dodge;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,rgba(120,220,255,.25) 55%,transparent 70%);
    background-size:250% 250%; animation:holomove 3s linear infinite;
  }
  @keyframes holomove{ 0%{ background-position:0% 0%;} 100%{ background-position:100% 100%;} }
  .card.refractor .front::after{
    content:""; position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; opacity:.8;
    background:linear-gradient(60deg,#ff3d8b,#ffcb3d,#39d98a,#5ad1ff,#b06cff);
    background-size:300% 300%; animation:holomove 4s linear infinite; filter:saturate(1.4);
    -webkit-mask-image:linear-gradient(115deg,transparent 35%,#000 50%,transparent 65%);
            mask-image:linear-gradient(115deg,transparent 35%,#000 50%,transparent 65%);
  }
  .card .hitflag{ position:absolute; bottom:6px; right:6px; font-size:13px; }
  .card.bighit{ box-shadow:0 0 0 2px var(--gold), 0 0 24px rgba(255,203,61,.6); }
  .card.pop{ animation:pop .4s ease; }
  @keyframes pop{ 0%{ transform:scale(.6); opacity:0;} 100%{ transform:scale(1); opacity:1;} }

  .pull-summary{ margin-top:16px; border-top:1px solid var(--line); padding-top:12px; font-size:14px; }
  .pull-summary .row{ display:flex; justify-content:space-between; padding:3px 0; }
  .pull-summary .row b.pos{ color:var(--good);} .pull-summary .row b.neg{ color:var(--bad);}

  /* Modal */
  .modal-bg{ position:fixed; inset:0; background:rgba(4,7,14,.78); display:flex; align-items:flex-start; justify-content:center; padding:30px 14px; overflow:auto; z-index:50; }
  .modal{ width:680px; max-width:100%; background:var(--bg2); border:1px solid var(--line); border-radius:16px; padding:20px; }
  .modal h2{ margin:0 0 6px; }
  .modal .close{ float:right; }
  table.odds{ width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  table.odds th, table.odds td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  table.odds th{ color:var(--dim); font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.5px; }
  table.odds td.r{ text-align:right; font-variant-numeric:tabular-nums; }
  .swatch{ display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:7px; vertical-align:middle; }

  .colllist{ margin-top:10px; }
  .collrow{ display:flex; align-items:center; gap:10px; padding:8px; border:1px solid var(--line); border-radius:10px; margin-bottom:7px; background:var(--panel); }
  .collrow .cl-rar{ width:7px; align-self:stretch; border-radius:4px; }
  .collrow .clthumb{ width:38px; height:38px; border-radius:8px; flex:0 0 auto;
    background:#0e1424 center 14%/cover no-repeat; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; color:#36456a; border:1px solid var(--line); }
  .collrow .cl-main{ flex:1; min-width:0; }
  .collrow .cl-main .cl-nm{ font-weight:700; }
  .collrow .cl-main .cl-sub{ font-size:12px; color:var(--dim); }
  .collrow .cl-val{ font-weight:800; color:var(--accent); white-space:nowrap; }
  .empty{ color:var(--dim); text-align:center; padding:30px; }

  .hint{ color:var(--dim); font-size:12px; text-align:center; margin-top:10px; }
  .footer{ text-align:center; color:var(--dim); font-size:11px; margin-top:30px; }
  .flash{ position:fixed; inset:0; pointer-events:none; z-index:40; opacity:0; }
  .flash.go{ animation:flashk .6s ease; }
  @keyframes flashk{ 0%{ opacity:0;} 30%{ opacity:.5;} 100%{ opacity:0;} }

  @media (max-width:520px){
    .brand h1{ font-size:20px; }
    .reveal{ grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); }
  }
</style>
</head>

/* ============================================================
   PRODUCTS
   Each: id, name, year, sport, brand, price, cardsPerPack,
   packsPerBox, pool, palette (pack art), and a "slots" model.

   The pull model:
   - cardsPerPack base cards, but a number of "chase rolls" replace
     base cards with parallels/inserts based on odds.
   - oddsPerPack values are probability a given pack yields >=1 of that type.
   Numbers are approximations of published hobby odds (see ODDS NOTES).
   ============================================================ */

/* ============================================================
   ENGINE
   ============================================================ */
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function chance(p){ return Math.random() < p; }

function pickPlayer(poolId){ return rnd(POOLS[poolId]); }

// Build a single pack of cards for a product
function openPack(prod){
  const pool = prod.pool;
  const n = prod.cardsPerPack;
  const cards = [];

  // Roll chases first (the "hits"); collect special cards
  const specials = [];
  for(const c of prod.chase){
    let made = 0;
    for(let k=0;k<(c.max||1);k++){
      if(chance(c.p)){
        specials.push(makeCard(prod, c));
        made++;
      }
    }
  }
  // Cap specials at pack size - keep best ones if overflow
  specials.sort((a,b)=> b.value - a.value);
  const keptSpecials = specials.slice(0, Math.max(1, n-1));

  // Fill the rest with base cards
  const baseCount = Math.max(0, n - keptSpecials.length);
  for(let i=0;i<baseCount;i++){
    cards.push(makeBase(prod));
  }
  // Insert specials at random positions, with biggest hit last
  keptSpecials.sort((a,b)=> a.value - b.value);
  for(const sp of keptSpecials){ cards.push(sp); }

  return cards;
}

function makeBase(prod){
  const pl = pickPlayer(prod.pool);
  return finishCard(prod, pl, "base", RAR.base, { foilType:null, label:"Base" });
}

function makeCard(prod, def){
  const pl = pickPlayer(prod.pool);
  const rar = RAR[def.rar] || RAR.parallel;
  let serial = null, colorName = null;

  if(def.runs && def.runs.length){
    const run = rnd(def.runs);
    serial = (1 + Math.floor(Math.random()*run)) + "/" + run;
  }
  if(def.rar === "oneofone"){ serial = "1/1"; }
  if(def.colors && def.colors.length){ colorName = rnd(def.colors); }

  let label = def.label;
  if(def.names && def.names.length){ label = rnd(def.names); }

  const opts = { foilType:def.foilType, label:label, serial:serial, colorName:colorName, hitClass:def.rar };
  return finishCard(prod, pl, def.rar, rar, opts);
}

function finishCard(prod, pl, rarKey, rar, opts){
  const [name, team, pos, tier] = pl;
  const value = cardValue(rarKey, opts, tier);
  const isHit = (rarKey!=="base");
  const big = ["auto","gold","superrare","oneofone","rare"].includes(rarKey);
  return {
    name, team, pos, tier,
    set: prod.brand, year: prod.year, sport: prod.sport,
    rarKey, rarName: rar.name, color: rar.color,
    label: opts.label, serial: opts.serial||null, colorName: opts.colorName||null,
    foilType: opts.foilType||null,
    auto: rarKey==="auto",
    firstBowman: prod.firstBowman && Math.random()<0.5,
    isHit, big, value
  };
}

// Approximate secondary-market-style value (in sim dollars).
// Calibrated so a pack's EV sits realistically BELOW its price — most
// cards are near-worthless, the occasional hit chases the cost back, and
// only rare big hits put a pack into the green. Ripping is -EV long term.
function cardValue(rarKey, opts, tier){
  const t = tier || 1.5;
  let v;
  switch(rarKey){
    case "base":      v = 0.06 * t; break;   // junk wax
    case "insert":    v = 0.6 * t; break;
    case "parallel":  v = 0.8 * t; break;
    case "refractor": v = 0.6 * t; break;
    case "silver":    v = 1.2 * t; break;
    case "numbered":  v = 1.0 * t; break;     // scaled further by print run below
    case "gold":      v = 8 * t; break;
    case "rare":      v = 6 * t; break;
    case "superrare": v = 14 * t; break;
    case "auto":      v = 4 * t; break;       // most autos are commons; stars carry the tail
    case "oneofone":  v = 55 * t; break;
    default:          v = 0.10;
  }
  // serial number scarcity bump (lower print run = pricier)
  if(opts && opts.serial){
    const m = /\/(\d+)/.exec(opts.serial);
    if(m){ const run = parseInt(m[1],10); v *= Math.min(7, Math.max(1, 220/run)); }
  }
  // long-tail randomness: occasional outlier "hot" copies, like a real market
  let mult = 0.55 + Math.random()*0.7;
  if(rarKey!=="base" && Math.random()<0.04) mult *= 1.9; // rare spike
  v *= mult;
  return Math.max(0.05, Math.round(v*100)/100);
}

function doRip(prod){
  if(state.balance < prod.price) return;
  state.balance -= prod.price; state.spent += prod.price; state.packs += 1;
  const cards = openPack(prod);
  currentPack = cards;
  registerPulls(prod, cards);
  save(); renderWallet();
  showReveal(prod, cards);
}

function doRipBox(prod){
  const total = prod.price*prod.packsPerBox;
  if(state.balance < total) return;
  let all = [];
  for(let i=0;i<prod.packsPerBox;i++){
    state.balance -= prod.price; state.spent += prod.price; state.packs += 1;
    const cards = openPack(prod);
    registerPulls(prod, cards);
    all = all.concat(cards);
  }
  save(); renderWallet();
  showReveal(prod, all, true);
}

function registerPulls(prod, cards){
  for(const c of cards){
    state.pullValue += c.value;
    if(c.isHit){
      state.collection.push(slimCard(c));
      if(!state.best || c.value > state.best.value){ state.best = slimCard(c); }
    }
  }
  // Keep the binder (and localStorage) healthy: retain the 600 best hits.
  if(state.collection.length > 800){
    state.collection.sort((a,b)=> b.value - a.value);
    state.collection.length = 600;
  }
}
function slimCard(c){
  return { name:c.name, team:c.team, pos:c.pos, set:c.set, year:c.year, sport:c.sport,
           rarKey:c.rarKey, rarName:c.rarName, color:c.color, label:c.label,
           serial:c.serial, colorName:c.colorName, auto:c.auto, value:c.value, firstBowman:c.firstBowman };
}

// Disambiguation / accented-title overrides for Wikipedia lookups
const TITLE_OVERRIDE = {
  "Nikola Jokic":"Nikola Jokić", "Luka Doncic":"Luka Dončić", "Alex Sarr":"Alexandre Sarr",
  "Ronald Acuna Jr.":"Ronald Acuña Jr.", "Julio Rodriguez":"Julio Rodríguez (baseball)",
  "Jose Ramirez":"José Ramírez (baseball)", "Fernando Tatis Jr.":"Fernando Tatís Jr.",
  "Yordan Alvarez":"Yordan Álvarez", "Jasson Dominguez":"Jasson Domínguez",
  "Max Clark":"Max Clark (baseball)", "Jesus Made":"Jesús Made", "Roman Anthony":"Roman Anthony (baseball)",
  "Charlie Condon":"Charlie Condon (baseball)", "Dylan Crews":"Dylan Crews",
  "Travis Bazzana":"Travis Bazzana", "Ethan Salas":"Ethan Salas"
};
function wikiTitle(name){ return TITLE_OVERRIDE[name] || name; }

function ensurePhoto(name){
  if(name in photoMap) return Promise.resolve(photoMap[name]);
  if(typeof fetch !== "function"){ return Promise.resolve(""); }
  if(photoPromises[name]) return photoPromises[name];
  // MediaWiki Action API in anonymous-CORS mode (origin=*); redirects=1 resolves
  // accented/alt spellings automatically. Returns an upload.wikimedia.org thumbnail.
  const u = "https://en.wikipedia.org/w/api.php?action=query&format=json&redirects=1"
          + "&prop=pageimages&piprop=thumbnail&pithumbsize=400&titles="
          + encodeURIComponent(wikiTitle(name)) + "&origin=*";
  photoPromises[name] = fetch(u)
    .then(r=> r.ok ? r.json() : null)
    .then(j=>{
      let img = "";
      try{
        const pages = j && j.query && j.query.pages;
        if(pages){
          const pg = pages[Object.keys(pages)[0]];
          if(pg && pg.thumbnail && pg.thumbnail.source) img = pg.thumbnail.source;
        }
      }catch(e){}
      photoMap[name] = img; savePhotos(); // cache definitive answer (incl. "no photo")
      return img;
    })
    .catch(()=>{ delete photoPromises[name]; return ""; }); // network error: allow retry later
  return photoPromises[name];
}

function hydratePhotos(scope){
  if(state.photos === false) return;
  scope.querySelectorAll(".photo[data-player]").forEach(el=>{
    const name = el.getAttribute("data-player");
    ensurePhoto(name).then(src=>{
      if(src){ el.style.backgroundImage = 'url("'+src+'")'; el.classList.add("has-img"); }
    });
  });
}

  let html = '<div class="opener">'+
    '<div class="opener-head"><div class="ptitle"><h2>'+(isBox?"BOX BREAK":"PACK")+' — '+prod.name+'</h2>'+
    '<div class="sub">Tap cards to flip · '+cards.length+' cards</div></div>'+
    '<button id="flipAll">Flip All</button></div>'+
    '<div class="packstage">'+
      '<div class="reveal" id="reveal">'+ cards.map(cardFrontHTML).join("") +'</div>'+
      '<div class="pull-summary">'+
        '<div class="row"><span>Cards revealed</span><b>'+cards.length+'</b></div>'+
        '<div class="row"><span>Hits (parallels / inserts / autos)</span><b>'+hits.length+'</b></div>'+
        '<div class="row"><span>Est. pull value</span><b>'+money(packVal)+'</b></div>'+
        '<div class="row"><span>Cost</span><b>'+money(cost)+'</b></div>'+
        '<div class="row"><span>This '+(isBox?"box":"pack")+'</span><b class="'+(profit>=0?"pos":"neg")+'">'+(profit>=0?"+":"")+money(profit)+'</b></div>'+
      '</div>'+
      '<div class="ripcontrols" style="margin-top:14px">'+
        '<button class="primary" id="again">RIP ANOTHER · '+money(prod.price)+'</button>'+
        '<button id="backToList">Other Products</button>'+
      '</div>'+
    '</div>'+
  '</div>';
  view.innerHTML = html;

  const revealEl = byId("reveal");
  hydratePhotos(revealEl);
  const cardEls = Array.from(revealEl.children);
  cardEls.forEach((el,i)=>{
    const c = cards[i];
    el.onclick = ()=>{
      if(el.classList.contains("flipped")) return;
      el.classList.add("flipped");
      if(c.big){ triggerFlash(c.color); }
    };
  });
  byId("flipAll").onclick = ()=>{
    let big = null;
    cardEls.forEach((el,i)=>{ el.classList.add("flipped"); if(cards[i].big && (!big||cards[i].value>big.value)) big=cards[i]; });
    if(big) triggerFlash(big.color);
  };
  byId("again").onclick = ()=>{ if(state.balance>=prod.price){ doRip(prod);} else { renderOpener(prod.id); } };
  byId("backToList").onclick = ()=> renderOpener(prod.id);

  renderWallet();
}

function triggerFlash(color){
  const f = byId("flash");
  f.style.background = "radial-gradient(circle at 50% 40%,"+color+"66,transparent 60%)";
  f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
}

/* ============================================================
   ODDS MODAL
   ============================================================ */
function modal(html){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = '<div class="modal">'+html+'</div>';
  bg.onclick = (e)=>{ if(e.target===bg) document.body.removeChild(bg); };
  document.body.appendChild(bg);
  const c = bg.querySelector(".close"); if(c) c.onclick = ()=>document.body.removeChild(bg);
  return bg;
}

function odds1in(p){
  if(p>=1) return "1 : 1";
  const x = Math.round(1/p);
  return "1 : " + x.toLocaleString();
}

function showOdds(prod){
  let rows = '<tr><th>Type</th><th class="r">Approx. odds</th></tr>';
  rows += '<tr><td><span class="swatch" style="background:'+RAR.base.color+'"></span>Base / Common</td><td class="r">most cards</td></tr>';
  for(const c of prod.chase){
    const r = RAR[c.rar];
    let extra = "";
    if(c.runs) extra = ' <span style="color:var(--dim)">('+c.runs.map(x=>"/"+x).join(", ")+')</span>';
    rows += '<tr><td><span class="swatch" style="background:'+r.color+'"></span>'+c.label+extra+'</td><td class="r">'+odds1in(c.p)+' packs</td></tr>';
  }
  modal(
    '<button class="close ghost" style="float:right">✕</button>'+
    '<h2>'+prod.name+' — Pull Odds</h2>'+
    '<div style="color:var(--dim);font-size:13px">'+prod.year+' • '+prod.cardsPerPack+' cards/pack • '+prod.packsPerBox+' packs/box • '+money(prod.price)+'/pack</div>'+
    '<table class="odds">'+rows+'</table>'+
    '<p style="color:var(--dim);font-size:12px;margin-top:12px">Odds are modeled on published hobby-pack configurations and rounded for simulation. Real-world odds vary by box and configuration.</p>'
  );
}

/* ============================================================
   COLLECTION MODAL
   ============================================================ */
function showCollection(){
  const coll = state.collection.slice().sort((a,b)=> b.value - a.value);
  let inner;
  if(!coll.length){
    inner = '<div class="empty">No hits yet. Rip some packs! Base cards aren’t tracked — only parallels, inserts, numbered, and autos land in your binder.</div>';
  } else {
    const totalVal = coll.reduce((s,c)=>s+c.value,0);
    inner = '<div style="color:var(--dim);font-size:13px;margin-bottom:6px">'+coll.length+' hits · est. '+money(totalVal)+
            (state.best?' · best: '+state.best.name+' '+money(state.best.value):'')+'</div><div class="colllist">';
    for(const c of coll){
      const sub = [c.colorName, c.label, c.serial?("#"+c.serial):null, c.auto?"AUTO":null, c.firstBowman?"1st Bowman":null].filter(Boolean).join(" · ");
      inner += '<div class="collrow">'+
        '<div class="cl-rar" style="background:'+c.color+'"></div>'+
        '<div class="photo clthumb" data-player="'+esc(c.name)+'"><span>'+initials(c.name)+'</span></div>'+
        '<div class="cl-main"><div class="cl-nm">'+c.name+' <span style="color:var(--dim);font-weight:400">'+c.team+'</span></div>'+
        '<div class="cl-sub">'+c.set+' '+c.year+' · '+sub+'</div></div>'+
        '<div class="cl-val">'+money(c.value)+'</div>'+
      '</div>';
    }
    inner += '</div>';
  }
  const bg = modal(
    '<button class="close ghost" style="float:right">✕</button>'+
    '<h2>📒 My Collection</h2>'+ inner
  );
  hydratePhotos(bg);
}

/* boot */
renderHome();
</script>
</body>
</html>
