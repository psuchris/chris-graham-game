<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>RIP CITY — Sports Card Pack Simulator</title>
<style>
  :root{
    --bg:#0a0e17; --bg2:#121826; --panel:#161d2e; --line:#27314a;
    --fg:#e8ecf5; --dim:#8b97b3; --accent:#ffcb3d; --good:#39d98a; --bad:#ff5d6c;
    --gold:#ffcb3d;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1b2740 0%, transparent 60%),
      var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-text-size-adjust:100%;
  }
  .wrap{ max-width:1040px; margin:0 auto; padding:16px 16px 60px; }

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; margin-bottom:14px;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand h1{
    font-size:26px; margin:0; letter-spacing:2px; font-weight:900;
    background:linear-gradient(90deg,#ffcb3d,#ff6ec7,#5ad1ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand .tag{ color:var(--dim); font-size:12px; letter-spacing:1px; text-transform:uppercase; }

  .wallet{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  }
  .stat{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:7px 11px; font-size:13px; line-height:1.1; min-width:74px;
  }
  .stat b{ display:block; font-size:16px; margin-top:3px; }
  .stat small{ color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .net.pos b{ color:var(--good); } .net.neg b{ color:var(--bad); }

  button{
    font-family:inherit; cursor:pointer; border-radius:10px;
    border:1px solid var(--line); background:var(--panel); color:var(--fg);
    padding:10px 14px; font-size:14px; font-weight:600;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
  }
  button:hover{ border-color:var(--accent); }
  button:active{ transform:translateY(1px); }
  button.primary{ background:linear-gradient(180deg,#ffd95e,#f5a623); color:#1a1300; border:none; font-weight:800; }
  button.ghost{ background:transparent; }
  button:disabled{ opacity:.45; cursor:not-allowed; }

  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }

  /* Product grid */
  .sport-group{ margin-bottom:20px; }
  .sport-group h2{
    font-size:14px; letter-spacing:2px; text-transform:uppercase; color:var(--dim);
    border-bottom:1px solid var(--line); padding-bottom:6px; margin:0 0 12px;
  }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .product{
    position:relative; border:1px solid var(--line); border-radius:14px; padding:14px;
    background:linear-gradient(160deg,var(--bg2),var(--panel));
    overflow:hidden; cursor:pointer; transition:transform .12s ease, border-color .12s ease;
  }
  .product:hover{ transform:translateY(-3px); border-color:var(--accent); }
  .product .sheen{ position:absolute; inset:0; background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%); pointer-events:none; }
  .product .yr{ font-size:11px; color:var(--dim); letter-spacing:1px; }
  .product h3{ margin:4px 0 2px; font-size:18px; }
  .product .meta{ font-size:12px; color:var(--dim); margin-top:8px; display:flex; justify-content:space-between; }
  .product .price{ color:var(--accent); font-weight:800; }
  .product .stripe{ height:5px; border-radius:4px; margin-top:10px; }

  /* Opening view */
  .opener{ }
  .opener-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .opener-head .ptitle h2{ margin:0; font-size:22px; }
  .opener-head .ptitle .sub{ color:var(--dim); font-size:13px; }

  .packstage{
    border:1px solid var(--line); border-radius:16px; padding:22px;
    background:radial-gradient(700px 300px at 50% 0%, #1c2742, var(--bg2));
    min-height:360px;
  }

  /* Pack art */
  .packart{
    width:200px; height:300px; margin:10px auto 18px; border-radius:14px;
    position:relative; cursor:pointer; user-select:none;
    box-shadow:0 18px 40px rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:18px 14px; text-align:center; overflow:hidden;
    transition:transform .15s ease;
  }
  .packart:hover{ transform:translateY(-4px) rotate(-1deg); }
  .packart .foilshine{ position:absolute; inset:0; background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%); mix-blend-mode:screen; animation:shine 3s linear infinite; }
  @keyframes shine{ 0%{ transform:translateX(-60%);} 100%{ transform:translateX(60%);} }
  .packart .pbrand{ font-weight:900; font-size:22px; letter-spacing:1px; text-shadow:0 2px 6px rgba(0,0,0,.6); }
  .packart .psport{ font-size:12px; letter-spacing:3px; text-transform:uppercase; opacity:.9; }
  .packart .ptap{ font-size:12px; background:rgba(0,0,0,.35); padding:5px 10px; border-radius:20px; }

  .ripcontrols{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  /* ---- Box format selector ---- */
  .fmtrow{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .fmt{ border:1px solid var(--line); border-radius:12px; padding:10px; cursor:pointer;
    background:var(--panel); font-size:11.5px; display:flex; flex-direction:column; gap:3px;
    transition:border-color .12s ease, transform .12s ease; }
  .fmt:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .fmt.on{ border-color:var(--accent); background:#241f10; box-shadow:0 0 0 1px var(--accent); }
  .fmt b{ font-size:13px; }
  .fmt .fx{ color:var(--dim); font-size:10px; }
  @media (max-width:520px){ .fmtrow{ grid-template-columns:1fr; } .fmt{ flex-direction:row; flex-wrap:wrap; align-items:baseline; gap:8px; } }

  /* ---- Graham family Legend cards (glow only AFTER the flip) ---- */
  .card.legendcard.flipped{ animation:legendpulse 1.6s ease-in-out infinite; }
  @keyframes legendpulse{
    0%,100%{ box-shadow:0 0 0 2px #39ffa0, 0 0 18px rgba(57,255,160,.5); }
    50%   { box-shadow:0 0 0 3px #39ffa0, 0 0 40px rgba(57,255,160,.95); }
  }
  .card.legendcard .front .photowrap{ background:linear-gradient(135deg,#39ffa0,#fff,#ffcb3d,#39ffa0); }

  /* Card reveal area */
  .reveal{ display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:12px; margin-top:6px; }
  .card{
    position:relative; aspect-ratio:5/7; border-radius:10px; cursor:pointer;
    perspective:800px; background:transparent;
  }
  .card .inner{ position:absolute; inset:0; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.2,.8,.2,1); }
  .card.flipped .inner{ transform:rotateY(180deg); }
  .card .face{ position:absolute; inset:0; border-radius:10px; backface-visibility:hidden; overflow:hidden; }
  .card .back{
    background:
      repeating-linear-gradient(45deg,#1d2742 0 10px,#222e4d 10px 20px);
    border:2px solid #2c3a5e;
    display:flex; align-items:center; justify-content:center;
  }
  .card .back span{ font-weight:900; letter-spacing:2px; color:#5b6b96; transform:rotate(-12deg); font-size:18px; }
  /* ---- Card face: framed trading-card layout --------------------------------
     --tc/--tc2 = team colors, --ac = parallel/frame accent.
     Structure: fbg (team-color art) → photowrap (foil-framed photo window)
     → bgfx (brand foil pattern) → topline / nameplate / rarline → glare.  */
  .card .front{
    transform:rotateY(180deg); display:block; color:#fff;
    background:
      linear-gradient(160deg, rgba(16,22,38,.25), rgba(5,7,12,.95) 78%),
      linear-gradient(160deg, var(--tc, #33415e), var(--tc2, #10141f) 85%);
    box-shadow:
      inset 0 0 0 2.5px var(--ac, var(--line)),
      inset 0 0 0 4px #05070c,
      inset 0 0 0 5px rgba(255,255,255,.16);
  }
  /* team-color slashes framing the photo window */
  .card .front .fbg{
    position:absolute; inset:5px; z-index:0; pointer-events:none; opacity:.85;
    background:
      linear-gradient(115deg, transparent 58%, var(--ac) 58.4%, var(--ac) 60%, transparent 60.5%),
      linear-gradient(295deg, transparent 74%, var(--tc) 74.4%, var(--tc) 77%, transparent 77.5%),
      radial-gradient(130% 55% at 50% 0%, var(--tc) 0%, transparent 62%);
  }
  /* foil-framed photo window (outer div paints the metallic edge) */
  .card .front .photowrap{
    position:absolute; top:8.5%; left:8.5%; right:5.5%; height:60%; z-index:1;
    padding:2px;
    background:linear-gradient(135deg, var(--ac), rgba(255,255,255,.85) 45%, var(--ac));
    box-shadow:0 4px 14px rgba(0,0,0,.55);
  }
  /* team-color rail down the left edge — reads like a printed spine */
  .card .front .rail{
    position:absolute; top:8.5%; bottom:12%; left:4%; width:2.5%; z-index:1;
    background:linear-gradient(180deg, var(--ac), var(--tc) 30%, var(--tc2));
    box-shadow:0 0 6px rgba(0,0,0,.4);
  }
  .card .front .photowrap .photo::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 -18px 26px rgba(5,8,14,.55), inset 0 4px 14px rgba(255,255,255,.07);
  }
  .card .front .photowrap .photo{
    position:relative; width:100%; height:100%; background-color:#0c1220;
    background-size:cover; background-position:center 18%; background-repeat:no-repeat;
    display:flex; align-items:center; justify-content:center;
  }
  .card .front .photo .initials{ font-size:38px; font-weight:900; color:rgba(255,255,255,.92); letter-spacing:1px; text-shadow:0 2px 10px rgba(0,0,0,.45); }
  .photo.has-img .initials, .clthumb.has-img span{ display:none; }
  /* subtle fade-in once a real photo lands */
  .photo.has-img{ animation:imgfade .3s ease; }
  @keyframes imgfade{ from{ opacity:.3; } to{ opacity:1; } }
  /* handwritten on-card autograph */
  .card .front .signature{
    position:absolute; bottom:34%; left:8%; right:8%; z-index:3;
    font-family:"Snell Roundhand","Savoye LET","Brush Script MT","Segoe Script","Dancing Script",cursive;
    font-style:italic; font-size:17px; line-height:1;
    letter-spacing:-.4px; white-space:nowrap; overflow:visible;
    transform:rotate(-7deg); transform-origin:left center;
    pointer-events:none; opacity:.95;
  }
  .swipewrap .card .front .signature{ font-size:26px; }
  .card .front .signature.sig-blue{ color:#2f54d9;
    text-shadow:0 1px 1px rgba(0,0,0,.4), 0 0 1px rgba(15,25,80,.7); }
  .card .front .signature.sig-gold{ color:#f0c24b;
    text-shadow:0 0 6px rgba(240,194,75,.55), 0 1px 1px rgba(60,40,0,.55); }
  /* top strip: brand wordmark + serial/year */
  .card .front .topline{
    position:absolute; top:3%; left:8%; right:8%; z-index:3;
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:10px; font-weight:900; letter-spacing:2px;
    text-shadow:0 1px 1px rgba(0,0,0,.9), 0 2px 6px rgba(0,0,0,.6);
  }
  .card .front .topline .bmark small{ font-size:6.5px; letter-spacing:1px; opacity:.8; margin-right:3px; font-weight:700; }
  .card .front .topline .ser{
    color:var(--ac); font-weight:900; letter-spacing:.5px;
    border:1px solid; border-color:inherit; padding:1px 5px; border-radius:3px;
    background:rgba(0,0,0,.45); box-shadow:0 0 8px rgba(0,0,0,.4);
    border-color:color-mix(in srgb, currentColor 60%, transparent);
  }
  .card .front .topline .ser.yr{ color:rgba(255,255,255,.75); font-size:8px; }
  /* team-color nameplate */
  .card .front .nameplate{
    position:absolute; left:8.5%; right:5.5%; bottom:12%; z-index:3;
    padding:4px 8px 5px;
    background:linear-gradient(115deg, var(--tc) 55%, var(--tc2));
    clip-path:polygon(0 0, 100% 0, 95% 100%, 0 100%);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45), inset 0 -8px 14px rgba(0,0,0,.25), 0 2px 10px rgba(0,0,0,.5);
    border-bottom:2px solid var(--ac);
  }
  .card .front .np-name{
    font-weight:900; font-size:12px; line-height:1.02; font-style:italic;
    text-transform:uppercase; letter-spacing:.2px;
    text-shadow:0 1px 3px rgba(0,0,0,.75);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card .front .np-sub{ font-size:7.5px; letter-spacing:1.4px; text-transform:uppercase; opacity:.95; margin-top:2px; text-shadow:0 1px 2px rgba(0,0,0,.7); }
  /* rarity line along the bottom edge */
  .card .front .rarline{
    position:absolute; left:8.5%; right:5.5%; bottom:3.4%; z-index:3;
    font-size:7.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase;
    color:var(--ac); text-shadow:0 1px 2px rgba(0,0,0,.8);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  /* bigger canvas in the swipe stack → scale the type up */
  .card .front .np-name.long{ font-size:9.5px; letter-spacing:0; }
  .swipewrap .card .front .np-name{ font-size:18px; }
  .swipewrap .card .front .np-name.long{ font-size:14px; }
  .swipewrap .card .front .np-sub{ font-size:10px; }
  .swipewrap .card .front .topline{ font-size:12px; }
  .swipewrap .card .front .topline .bmark small{ font-size:8.5px; }
  .swipewrap .card .front .rarline{ font-size:10px; }
  .swipewrap .card .front .photo .initials{ font-size:60px; }

  /* ---- Brand design system -------------------------------------------------
     Each brand reshapes the photo window & nameplate (clip-path) and lays its
     own foil pattern (.bgfx) over the face — like real product lines.       */
  .card .front .bgfx{ position:absolute; inset:0; z-index:2; pointer-events:none; }
  .rc{ display:inline-block; font-size:8px; font-weight:900; line-height:1; vertical-align:middle; font-style:normal;
       background:linear-gradient(180deg,#ffe06a,#f5a623); color:#231600; padding:2px 3px;
       border-radius:3px; margin-left:5px; box-shadow:0 1px 3px rgba(0,0,0,.5); }
  .swipewrap .rc{ font-size:11px; padding:3px 4px; }
  .fbshield{ position:absolute; z-index:4; top:11%; right:8%;
       font-size:7px; font-weight:900; letter-spacing:.5px; color:#15233f;
       background:linear-gradient(180deg,#ffe89a,#f3b008); padding:3px 5px; border-radius:5px;
       box-shadow:0 1px 5px rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.5); }
  .fbshield i{ font-style:normal; font-size:5px; vertical-align:top; }

  /* PANINI PRIZM — notched chrome window + prizm sparkle */
  .br-prizm .front .photowrap, .br-prizm .front .photowrap .photo{
    clip-path:polygon(0 0, 91% 0, 100% 8%, 100% 100%, 9% 100%, 0 92%); }
  .br-prizm .front .bgfx{ opacity:.3; mix-blend-mode:screen;
    background-image:radial-gradient(rgba(255,255,255,.55) .7px, transparent 1.2px); background-size:7px 7px; }
  .br-prizm .front .bmark{ color:#eef2fb; }

  /* DONRUSS OPTIC — slashed window + holo dots */
  .br-optic .front .photowrap, .br-optic .front .photowrap .photo{
    clip-path:polygon(0 0, 100% 0, 100% 87%, 0 100%); }
  .br-optic .front .nameplate{ clip-path:polygon(5% 0, 100% 0, 100% 100%, 0 100%); }
  .br-optic .front .bgfx{ opacity:.5; mix-blend-mode:screen;
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,.06) 0 1px, transparent 1px 7px),
      radial-gradient(rgba(176,108,255,.4) 1px, transparent 1.7px);
    background-size:auto, 9px 9px; }
  .br-optic .front .bmark{ color:#e9dcff; }
  .br-optic .front .bmark small{ color:#ff7b1a; }

  /* TOPPS CHROME — swoosh window + chrome streaks */
  .br-chrome .front .photowrap, .br-chrome .front .photowrap .photo{
    border-radius:7px 7px 42% 7px / 7px 7px 16% 7px; }
  .br-chrome .front .nameplate{ clip-path:none; border-radius:5px 16px 16px 5px; }
  .br-chrome .front .bgfx{ opacity:.55; mix-blend-mode:screen;
    background-image:
      linear-gradient(180deg, rgba(255,255,255,.2), transparent 36%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 5px); }
  .br-chrome .front .bmark{ color:#dcefff; }
  .br-chrome .front .bmark small{ color:#ff5d8f; }

  /* TOPPS FINEST — beveled hex window + teal tech lines */
  .br-finest .front .photowrap, .br-finest .front .photowrap .photo{
    clip-path:polygon(8% 0, 92% 0, 100% 9%, 100% 91%, 92% 100%, 8% 100%, 0 91%, 0 9%); }
  .br-finest .front .nameplate{ clip-path:polygon(0 0, 100% 0, 93% 100%, 7% 100%); text-align:center; }
  .br-finest .front .bgfx{ opacity:.6; mix-blend-mode:screen;
    background-image:
      radial-gradient(130% 55% at 50% -8%, rgba(0,224,212,.3), transparent 60%),
      repeating-linear-gradient(90deg, rgba(0,224,212,.13) 0 1px, transparent 1px 6px); }
  .br-finest .front .bmark{ color:#9bfaf0; letter-spacing:3px; }
  .br-finest .front .bmark small{ color:#7fd9d2; }

  /* TOPPS CHROME FOOTBALL — pennant-cut window + yard-line grid */
  .br-chromefb .front .photowrap, .br-chromefb .front .photowrap .photo{
    clip-path:polygon(0 4%, 46% 0, 54% 0, 100% 4%, 100% 100%, 54% 96%, 46% 100%, 0 96%); }
  .br-chromefb .front .nameplate{ clip-path:polygon(3% 0, 97% 0, 100% 50%, 97% 100%, 3% 100%, 0 50%); text-align:center; }
  .br-chromefb .front .bgfx{ opacity:.5; mix-blend-mode:screen;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.09) 0 1px, transparent 1px 14px),
      repeating-linear-gradient(90deg, rgba(200,16,46,.16) 0 2px, transparent 2px 26px),
      linear-gradient(180deg, rgba(255,255,255,.16), transparent 40%); }
  .br-chromefb .front .bmark{ color:#ffd9de; }
  .br-chromefb .front .bmark small{ color:#9db8f0; }

  /* BOWMAN CHROME — clean frame, blue weave, blocky left-bar nameplate */
  .br-bowman .front .nameplate{ clip-path:none; border-left:5px solid var(--ac); }
  .br-bowman .front .bgfx{ opacity:.55; mix-blend-mode:screen;
    background-image:
      radial-gradient(130% 65% at 50% -8%, rgba(54,118,238,.4), transparent 62%),
      repeating-linear-gradient(125deg, rgba(255,255,255,.07) 0 1px, transparent 1px 8px); }
  .br-bowman .front .bmark{ color:#dbe7ff; }
  .br-bowman .front .bmark small{ color:#ffcb3d; }
  /* Foil rarity = animated BORDER ring, not a sheen over the whole card.
     The ring is drawn with a padding+mask trick so only the frame shows. */
  .card.refractor .front::after,
  .card.holo .front::after{
    content:""; position:absolute; inset:0; border-radius:8px; padding:3.5px;
    pointer-events:none; z-index:6;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite:exclude;
  }
  .card.refractor .front::after{
    background:linear-gradient(120deg,#ff3d8b,#ffcb3d,#39d98a,#5ad1ff,#b06cff,#ff3d8b);
    background-size:400% 400%; animation:borderflow 5s linear infinite; filter:saturate(1.3);
  }
  .card.holo .front::after{
    background:linear-gradient(120deg,#8fa8d8,#eef4ff,#7fd0ff,#c0cff0,#8fa8d8);
    background-size:400% 400%; animation:borderflow 6s linear infinite;
  }
  @keyframes borderflow{ 0%{ background-position:0% 50%;} 100%{ background-position:400% 50%;} }
  .card .hitflag{ position:absolute; bottom:6px; right:6px; font-size:13px; z-index:6; }
  .card.bighit.flipped{ box-shadow:0 0 0 2px var(--gold), 0 0 24px rgba(255,203,61,.6); }
  .card.pop{ animation:pop .4s ease; }
  @keyframes pop{ 0%{ transform:scale(.6); opacity:0;} 100%{ transform:scale(1); opacity:1;} }

  /* ---- Card animation juice ---- */
  /* (no pre-flip tells: every card back looks identical until revealed) */
  /* big hits flip slow & dramatic */
  .card.bigflip .inner{ transition:transform 1.05s cubic-bezier(.3,.9,.25,1); }
  /* cards dealt into the grid with a stagger (delay set inline) */
  .card.dealin{ animation:dealk .45s cubic-bezier(.2,.8,.3,1) backwards; }
  @keyframes dealk{ from{ transform:translateY(26px) scale(.82); opacity:0; } }
  /* pointer-tracked glare for the 3D tilt effect */
  .card .front .glare{ position:absolute; inset:0; z-index:5; opacity:0; pointer-events:none;
    transition:opacity .35s ease; background:radial-gradient(46% 46% at 50% 50%, rgba(255,255,255,.45), transparent 70%);
    background-repeat:no-repeat; background-size:200% 200%; mix-blend-mode:screen; }
  /* spark burst on big hits */
  .spark{ position:fixed; width:7px; height:7px; border-radius:2px; z-index:65; pointer-events:none;
    animation:sparkfly .9s cubic-bezier(.15,.6,.4,1) forwards; }
  @keyframes sparkfly{
    0%  { transform:translate(0,0) scale(1) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--dx),var(--dy)) scale(.15) rotate(230deg); opacity:0; }
  }
  /* whole-screen shake for monster pulls */
  .wrap.shake{ animation:screenshake .55s ease; }
  @keyframes screenshake{
    0%,100%{ transform:none; } 20%{ transform:translate(-7px,4px) rotate(-.4deg); }
    40%{ transform:translate(6px,-5px) rotate(.3deg); } 60%{ transform:translate(-5px,3px); }
    80%{ transform:translate(4px,-2px); }
  }

  /* ---- Pack opening (tear) animation ---- */
  .tearstage{ min-height:380px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .tearpack{ position:relative; width:212px; height:304px; border-radius:14px; overflow:hidden; cursor:pointer;
    box-shadow:0 18px 44px rgba(0,0,0,.55); }
  .tearpack.go{ animation:packshake .45s ease both; }
  @keyframes packshake{ 0%,100%{ transform:rotate(0);} 20%{ transform:rotate(-3deg);} 40%{ transform:rotate(3deg);} 60%{ transform:rotate(-2deg);} 80%{ transform:rotate(2deg);} }
  .tearpack .pbrand{ font-weight:900; font-size:21px; letter-spacing:1px; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.6); }
  .tearpack .psport{ font-size:12px; letter-spacing:3px; text-transform:uppercase; color:#fff; opacity:.92; text-shadow:0 1px 4px rgba(0,0,0,.6); }
  .tearpack .tearlid{ position:absolute; top:0; left:0; right:0; height:34%; z-index:3;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.16); border-bottom:2px dashed rgba(255,255,255,.55); transform-origin:top center; }
  .tearpack.go .tearlid{ animation:lidrip .6s .42s forwards cubic-bezier(.4,0,.2,1); }
  @keyframes lidrip{ to{ transform:translateY(-130%) rotate(-8deg); opacity:0; } }
  .tearpack .tearbody{ position:absolute; inset:0; z-index:2; display:flex; align-items:flex-end; justify-content:center; padding-bottom:20px; }
  .tearpack .burst{ position:absolute; inset:0; z-index:4; opacity:0; pointer-events:none;
    background:radial-gradient(circle at 50% 36%, rgba(255,255,255,.96), rgba(255,255,255,0) 55%); }
  .tearpack.go .burst{ animation:burstk .65s .48s forwards; }
  @keyframes burstk{ 0%{ opacity:0;} 45%{ opacity:.95;} 100%{ opacity:0;} }

  /* ---- Swipe-to-reveal stack ---- */
  .stackstage{ display:flex; flex-direction:column; align-items:center; }
  .swipewrap{ position:relative; width:240px; height:336px; margin:8px auto 0; touch-action:pan-y; user-select:none; }
  .swipewrap .card{ position:absolute; left:0; top:0; width:240px; height:336px; aspect-ratio:auto;
    cursor:grab; will-change:transform; box-shadow:0 14px 30px rgba(0,0,0,.5); }
  .swipewrap .card:active{ cursor:grabbing; }
  .swipehint{ text-align:center; color:var(--dim); font-size:12px; letter-spacing:2px; margin-top:14px; }
  .stackbar{ display:flex; align-items:center; gap:16px; justify-content:center; margin-top:10px; }
  .stackcount{ font-size:13px; color:var(--dim); min-width:66px; text-align:center; }
  .stackcount b{ color:var(--fg); font-size:17px; } .stackcount span{ font-size:13px; }
  @media (max-width:520px){
    .swipewrap{ width:210px; height:294px; } .swipewrap .card{ width:210px; height:294px; }
  }

  .pull-summary{ margin-top:16px; border-top:1px solid var(--line); padding-top:12px; font-size:14px; }
  .pull-summary .row{ display:flex; justify-content:space-between; padding:3px 0; }
  .pull-summary .row b.pos{ color:var(--good);} .pull-summary .row b.neg{ color:var(--bad);}

  /* Modal */
  .modal-bg{ position:fixed; inset:0; background:rgba(4,7,14,.78); display:flex; align-items:flex-start; justify-content:center; padding:30px 14px; overflow:auto; z-index:50; }
  .modal{ width:680px; max-width:100%; background:var(--bg2); border:1px solid var(--line); border-radius:16px; padding:20px; }
  .modal h2{ margin:0 0 6px; }
  .modal .close{ float:right; }
  table.odds{ width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  table.odds th, table.odds td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  table.odds th{ color:var(--dim); font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.5px; }
  table.odds td.r{ text-align:right; font-variant-numeric:tabular-nums; }
  .swatch{ display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:7px; vertical-align:middle; }

  .colllist{ margin-top:10px; }
  .collrow{ display:flex; align-items:center; gap:10px; padding:8px; border:1px solid var(--line); border-radius:10px; margin-bottom:7px; background:var(--panel); }
  .collrow .cl-rar{ width:7px; align-self:stretch; border-radius:4px; }
  .collrow .clthumb{ width:38px; height:38px; border-radius:8px; flex:0 0 auto;
    background:#0e1424 center 14%/cover no-repeat; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; color:rgba(255,255,255,.9); text-shadow:0 1px 4px rgba(0,0,0,.5); border:1px solid var(--line); }
  .collrow .cl-main{ flex:1; min-width:0; }
  .collrow .cl-main .cl-nm{ font-weight:700; }
  .collrow .cl-main .cl-sub{ font-size:12px; color:var(--dim); }
  .collrow .cl-val{ font-weight:800; color:var(--accent); white-space:nowrap; }
  .empty{ color:var(--dim); text-align:center; padding:30px; }

  /* ---- Collection controls / selling ---- */
  .chiprow{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:10px 0 4px; }
  .chip{ font-size:12px; padding:5px 10px; border-radius:20px; background:var(--panel);
    border:1px solid var(--line); cursor:pointer; color:var(--dim); user-select:none; }
  .chip.on{ color:var(--fg); border-color:var(--accent); background:#241f10; }
  .chip:hover{ border-color:var(--accent); }
  .cl-side{ text-align:right; }
  .collbtns{ display:flex; gap:4px; margin-top:4px; justify-content:flex-end; }
  .collbtns button{ font-size:10px; padding:4px 7px; border-radius:7px; }
  .gradechip{ display:inline-block; font-size:9px; font-weight:900; padding:1px 6px;
    border-radius:5px; margin-left:6px; vertical-align:1px; border:1px solid; }

  /* ---- Toast notifications ---- */
  .toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:70;
    background:#1c2742; border:1px solid var(--gold); border-radius:12px; padding:10px 16px;
    font-size:13px; font-weight:600; max-width:88vw; box-shadow:0 10px 30px rgba(0,0,0,.5);
    animation:toastk 3.2s forwards; pointer-events:none; }
  @keyframes toastk{ 0%{ opacity:0; transform:translate(-50%,14px);} 8%{ opacity:1; transform:translate(-50%,0);} 85%{ opacity:1;} 100%{ opacity:0; } }

  /* ---- Grading slab ---- */
  .slab{ width:240px; margin:14px auto 4px; border:2px solid #3a4666; border-radius:12px;
    background:linear-gradient(180deg,#232c47,#161d2e); padding:12px; text-align:center; }
  .slab .slabhead{ display:flex; justify-content:space-between; font-size:10px; letter-spacing:1px;
    color:var(--dim); border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:10px; }
  .slab .gradeball{ font-size:46px; font-weight:900; margin:8px 0 4px; min-height:56px; }
  .slab .spin{ font-size:32px; animation:spinr 1s linear infinite; display:inline-block; }
  @keyframes spinr{ to{ transform:rotate(360deg); } }

  /* ---- Stats & achievements ---- */
  .statgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; margin-top:12px; }
  .achgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:10px; }
  .ach{ border:1px solid var(--line); border-radius:10px; padding:9px; background:var(--panel); font-size:11px; color:var(--dim); }
  .ach b{ display:block; font-size:13px; color:var(--fg); margin-bottom:2px; }
  .ach.locked{ opacity:.35; filter:grayscale(1); }

  .hint{ color:var(--dim); font-size:12px; text-align:center; margin-top:10px; }
  .footer{ text-align:center; color:var(--dim); font-size:11px; margin-top:30px; }
  .flash{ position:fixed; inset:0; pointer-events:none; z-index:40; opacity:0; }
  .flash.go{ animation:flashk .6s ease; }
  @keyframes flashk{ 0%{ opacity:0;} 30%{ opacity:.5;} 100%{ opacity:0;} }

  @media (max-width:520px){
    .brand h1{ font-size:20px; }
    .reveal{ grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); }
  }

/* ============================================================
   BOX TYPES  — Hobby vs Mega vs Blaster
   Hobby: full price, all the packs, autos at full odds.
   Mega/Blaster (retail): cheaper, fewer/smaller packs, chases cut
   way down, autos are a long shot — but each has an EXCLUSIVE
   parallel you cannot pull anywhere else (defined per product).
   ============================================================ */
const BOX_TYPES = {
  hobby:  { key:"hobby",   label:"Hobby",   icon:"🎩", priceMult:1.0,  cppMult:1.0,
            oddsMult:1.0,  autoMult:1.0,  legendMult:1.0,
            blurb:"Autos live here · best odds" },
  mega:   { key:"mega",    label:"Mega",    icon:"📦", priceMult:0.62, cppMult:0.75, packsFixed:8,
            oddsMult:0.55, autoMult:0.12, legendMult:0.6,
            blurb:"Retail · exclusive parallel" },
  blaster:{ key:"blaster", label:"Blaster", icon:"🛒", priceMult:0.42, cppMult:0.6,  packsFixed:6,
            oddsMult:0.3,  autoMult:0.05, legendMult:0.4,
            blurb:"Cheap rips · exclusive parallel" }
};
function getFormat(prod, key){
  const t = BOX_TYPES[key] || BOX_TYPES.hobby;
  const packs = t.packsFixed || prod.packsPerBox;
  const cpp = Math.max(3, Math.round(prod.cardsPerPack * t.cppMult));
  const packPrice = Math.max(2, Math.round(prod.price * t.priceMult));
  // Graham Legends odds scale with pack price so cheap products don't
  // become legend printers; hobby pulls them ~2.5x as often as blasters
  const legendP = (packPrice/7000) * t.legendMult;
  return Object.assign({}, t, {
    packs, cpp, packPrice, legendP,
    excl: prod.excl ? prod.excl[t.key] : null
  });
}

function makeLegendCard(prod){
  const L = rnd(LEGENDS);
  const run = rnd([10,5,1]);
  const serial = run===1 ? "1/1" : (1+Math.floor(Math.random()*run))+"/"+run;
  const card = finishCard(prod, [L.name, L.team, L.pos, 5], "legend", RAR.legend,
    { foilType:"refractor", label:"RIP City Legends · "+L.variant, serial:serial });
  card.photoKey = L.key;
  card.tcOverride = L.colors;
  card.legend = true;
  return card;
}

/* ============================================================
   STATE  (persisted to localStorage)
   ============================================================ */
const SAVE_KEY = "ripcity_save_v1";
let state = load();

function freshState(){
  return { balance:100, spent:0, packs:0, pullValue:0, sold:0, best:null,
           collection:[], seq:1, ach:{}, counts:{}, rev:0 };
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && typeof s.balance==="number"){
      const st = Object.assign(freshState(), s);
      // migrate older saves: every card needs an id, and seq must stay ahead
      for(const c of st.collection){
        if(!c.id) c.id = st.seq++;
        else st.seq = Math.max(st.seq, c.id+1);
      }
      return st;
    }
  }catch(e){}
  return freshState();
}
let warnedSave = false;
function save(){
  try{
    // never clobber a NEWER save made by another tab/session
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && (s.rev||0) > (state.rev||0)){
      state = Object.assign(freshState(), s);
      toast("↻ Synced with your other session");
      renderWallet(); rerender();
      return;
    }
  }catch(e){}
  state.rev = (state.rev||0)+1;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  }catch(e){
    if(!warnedSave){ warnedSave = true; toast("⚠️ Couldn't save progress — storage blocked/full. Pulls may not survive a reload."); }
  }
}
// Multi-tab / restored-tab protection: if another tab (or an earlier session
// Safari restored) saved a NEWER state, adopt it instead of clobbering it,
// and never let a stale tab overwrite a newer save.
function syncFromStorage(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && typeof s.balance==="number" && (s.rev||0) > (state.rev||0)){
      state = Object.assign(freshState(), s);
      renderWallet(); rerender();
    }
  }catch(e){}
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) syncFromStorage(); });
window.addEventListener("pageshow", syncFromStorage);

   ENGINE

function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function chance(p){ return Math.random() < p; }

function pickPlayer(poolId){ return rnd(POOLS[poolId]); }

// Weighted hit-subject selection. Real auto/insert checklists are dominated by
// commons & rookies — stars are short-printed or absent — so a star "hit" is
// genuinely rare. We bias selection toward LOWER tiers by weight 1/tier^k.
// Bigger k = stronger bias to commons (used for autos & top-end hits), which
// keeps EV sane while letting the occasional star hit be worth real money.
const HIT_BIAS = {
  auto:4.2, oneofone:3.0, superrare:3.2, gold:3.0, rare:3.0, casehit:1.2,
  numbered:2.0, silver:1.8, parallel:0.7, insert:0.7, refractor:0.7
};
function pickHitPlayer(poolId, rarKey){
  const arr = POOLS[poolId];
  const k = HIT_BIAS[rarKey] || 0;
  if(!k) return rnd(arr);
  let tot = 0; const w = new Array(arr.length);
  for(let i=0;i<arr.length;i++){ w[i] = 1/Math.pow(arr[i][3]||1.5, k); tot += w[i]; }
  let r = Math.random()*tot;
  for(let i=0;i<arr.length;i++){ r -= w[i]; if(r<=0) return arr[i]; }
  return arr[arr.length-1];
}

// Build a single pack of cards for a product in a given box format
function openPack(prod, fmt){
  fmt = fmt || getFormat(prod, "hobby");
  const n = fmt.cpp;
  const cards = [];

  // Roll chases first (the "hits"); retail formats cut the odds hard
  const specials = [];
  for(const c of prod.chase){
    const mult = c.rar==="auto" ? fmt.autoMult : fmt.oddsMult;
    for(let k=0;k<(c.max||1);k++){
      if(chance(c.p * mult)){
        specials.push(makeCard(prod, c));
      }
    }
  }
  // this box type's exclusive parallel
  if(fmt.excl && chance(fmt.excl.p)){
    specials.push(makeCard(prod, {
      rar:fmt.excl.rar, label:fmt.excl.label+" · "+fmt.label+" Excl.",
      p:fmt.excl.p, foilType:"refractor", runs:fmt.excl.runs
    }));
  }
  // Graham family legend roll
  if(chance(fmt.legendP)){
    specials.push(makeLegendCard(prod));
  }
  // Cap specials at pack size - keep best ones if overflow
  specials.sort((a,b)=> b.value - a.value);
  const keptSpecials = specials.slice(0, Math.max(1, n-1));

  // Fill the rest with base cards
  const baseCount = Math.max(0, n - keptSpecials.length);
  for(let i=0;i<baseCount;i++){
    cards.push(makeBase(prod));
  }
  // Insert specials at random positions, with biggest hit last
  keptSpecials.sort((a,b)=> a.value - b.value);
  for(const sp of keptSpecials){ cards.push(sp); }

  return cards;
}

function makeBase(prod){
  const pl = pickPlayer(prod.pool);
  return finishCard(prod, pl, "base", RAR.base, { foilType:null, label:"Base" });
}

function makeCard(prod, def){
  const pl = pickHitPlayer(prod.pool, def.rar);
  const rar = RAR[def.rar] || RAR.parallel;
  let serial = null, colorName = null;

  if(def.runs && def.runs.length){
    const run = rnd(def.runs);
    serial = (1 + Math.floor(Math.random()*run)) + "/" + run;
  }
  if(def.rar === "oneofone"){ serial = "1/1"; }
  if(def.colors && def.colors.length){ colorName = rnd(def.colors); }

  let label = def.label;
  if(def.names && def.names.length){ label = rnd(def.names); }

  const opts = { foilType:def.foilType, label:label, serial:serial, colorName:colorName, hitClass:def.rar };
  return finishCard(prod, pl, def.rar, rar, opts);
}

function finishCard(prod, pl, rarKey, rar, opts){
  const [name, team, pos, tier, rookie] = pl;
  // 1st Bowman cards are, by definition, the player's rookie-eligible prospect card
  const isRookie = !!rookie || !!prod.firstBowman;
  const value = cardValue(rarKey, opts, tier, prod, isRookie);
  const isHit = (rarKey!=="base");
  const big = ["auto","gold","superrare","oneofone","rare","legend","casehit"].includes(rarKey);
  return {
    name, team, pos, tier, rookie: isRookie,
    set: prod.brand, year: prod.year, sport: prod.sport, design: prod.design||"generic",
    rarKey, rarName: rar.name, color: rar.color,
    label: opts.label, serial: opts.serial||null, colorName: opts.colorName||null,
    foilType: opts.foilType||null,
    auto: rarKey==="auto",
    firstBowman: prod.firstBowman===true,
    isHit, big, value
  };
}

// ---- Value model ------------------------------------------------------------
// Approximate secondary-market value (in sim dollars). The goal is *realism*
// of the spread, not a flat payout:
//   • Player matters most. A star's auto dwarfs a bench player's auto — value
//     scales on a star^2 curve so the hobby's heavy top-end is reproduced.
//   • Rarity tier sets the multiplier band (base pennies → 1/1 four figures).
//   • Serial print run compounds scarcity (a /5 is worth far more than a /199).
//   • Rookies/1st-Bowman carry a premium — that's where the market chases.
//   • A brand premium (Prizm/Chrome sell at a markup) nudges the whole product.
//   • Market noise adds spread plus an occasional "hot copy" spike.
// Calibrated so a pack's EV sits a bit BELOW its price: most cards are near
// worthless, the rare big hit chases the cost back. Ripping is -EV long term.
const MARKET = 0.42; // global damping that sets the rip-vs-singles gap (great boxes can top 100%)
function cardValue(rarKey, opts, tier, prod, rookie){
  const t = tier || 1.5;
  const star = Math.pow(t, 2.1) / 6;     // t1≈0.17, t3≈1.6, t4≈3.0, t4.6≈4.1, t5≈5.1
  const sp   = Math.pow(star, 1.4);      // star-power: steep curve so commons are
                                         // cheap and only true stars carry value
                                         // (t1.5≈0.24, t2.4≈1.1, t3≈1.9, t4.6≈7.2, t5≈9.8)
  // small flat floor + star-power term. Star hits are RARE (pickHitPlayer biases
  // away from them), so the top end can be priced like the real market: a common
  // rookie auto ≈ $10-25, an Edwards/Wembanyama auto ≈ several hundred.
  let base;
  switch(rarKey){
    case "base":      base = 0.05 + 0.13*Math.pow(sp,1.9); break; // steep star curve: superstar base RCs are real dollars, commons stay pennies
    case "insert":    base = 0.3  + 0.8*sp;   break;
    case "parallel":  base = 0.4  + 1.1*sp;   break;  // colored prizms
    case "refractor": base = 0.3  + 0.9*sp;   break;
    case "silver":    base = 0.5  + 2.2*sp;   break;  // Silver Prizm / Holo
    case "numbered":  base = 0.8  + 3.5*sp;   break;  // further scaled by run
    case "rare":      base = 4    + 18*sp;    break;  // /25-ish
    case "gold":      base = 6    + 30*sp;    break;  // /10
    case "superrare": base = 10   + 50*sp;    break;  // /5
    case "auto":      base = 4    + 38*sp;    break;  // star autos carry the tail
    case "oneofone":  base = 40   + 140*sp;   break;  // 1/1 SuperFractor / Black
    case "casehit":   base = 45   + 40*sp;    break;  // Manga/Downtown/Color Blast money
    case "legend":    base = 45   + 14*sp;    break;  // Graham family chase
    default:          base = 0.15;
  }
  let v = base * ((prod && prod.valMult) || 1);

  // rookie / 1st-Bowman premium (the part of the market that chases hardest)
  if(rookie && rarKey!=="base") v *= 1.5;
  else if(rookie) v *= 1.15;

  // serial print-run scarcity — ONLY for variable-run parallels (a /199 vs a
  // /49 of the same player). The fixed-run rarities (rare=/25, gold=/10,
  // superrare=/5, oneofone=1/1) already price their run into the base above,
  // so applying a serial multiplier there would double-count it.
  if(opts && opts.serial && (rarKey==="numbered"||rarKey==="refractor"||rarKey==="silver"||rarKey==="parallel"||rarKey==="legend")){
    const m = /\/(\d+)/.exec(opts.serial);
    if(m){ const run = parseInt(m[1],10); v *= Math.min(6, Math.max(1, 200/run)); }
    if(rarKey==="legend" && opts.serial==="1/1") v *= 2.5;  // the family grail
  }

  // market noise + occasional outlier "hot" copy
  let mult = 0.6 + Math.random()*0.7;
  if(rarKey!=="base" && Math.random()<0.08) mult *= 2.6;
  v *= mult * MARKET;
  return Math.max(0.05, Math.round(v*100)/100);
}

function doRip(prod, fmt){
  fmt = fmt || getFormat(prod, "hobby");
  if(state.balance < fmt.packPrice) return;
  state.balance -= fmt.packPrice; state.spent += fmt.packPrice; state.packs += 1;
  const cards = openPack(prod, fmt);
  currentPack = cards;
  registerPulls(prod, cards);
  save(); renderWallet();
  playPackOpening(prod, cards, false, fmt);
}

function doRipBox(prod, fmt){
  fmt = fmt || getFormat(prod, "hobby");
  const total = fmt.packPrice*fmt.packs;
  if(state.balance < total) return;
  let all = [];
  for(let i=0;i<fmt.packs;i++){
    state.balance -= fmt.packPrice; state.spent += fmt.packPrice; state.packs += 1;
    const cards = openPack(prod, fmt);
    registerPulls(prod, cards);
    all = all.concat(cards);
  }
  save(); renderWallet();
  playPackOpening(prod, all, true, fmt);
}

function registerPulls(prod, cards){
  for(const c of cards){
    state.pullValue += c.value;
    if(c.isHit){
      const sc = slimCard(c);
      sc.id = state.seq++;
      c.colId = sc.id;   // lets the reveal screen quick-sell this pack's hits
      state.collection.push(sc);
      state.counts[c.rarKey] = (state.counts[c.rarKey]||0)+1;
      state.counts.hits = (state.counts.hits||0)+1;
      if(c.auto && c.rookie) state.counts.rcauto = (state.counts.rcauto||0)+1;
      if(!state.best || c.value > state.best.value){ state.best = sc; }
    }
  }
  // Keep the binder (and localStorage) healthy: retain the 600 best hits.
  if(state.collection.length > 800){
    state.collection.sort((a,b)=> b.value - a.value);
    state.collection.length = 600;
  }
  checkAch();
}
function slimCard(c){
  return { name:c.name, team:c.team, pos:c.pos, set:c.set, year:c.year, sport:c.sport,
           rarKey:c.rarKey, rarName:c.rarName, color:c.color, label:c.label, design:c.design,
           serial:c.serial, colorName:c.colorName, auto:c.auto, value:c.value,
           firstBowman:c.firstBowman, rookie:c.rookie,
           photoKey:c.photoKey, tcOverride:c.tcOverride, legend:c.legend };
}

function sellCard(id, silent){
  const i = state.collection.findIndex(x=>x.id===id);
  if(i<0) return 0;
  const c = state.collection[i];
  state.balance += c.value;
  state.sold = (state.sold||0) + c.value;
  state.collection.splice(i,1);
  save(); renderWallet(); updateCollCount(); checkAch();
  if(!silent) toast("Sold "+c.name+" for "+money(c.value));
  return c.value;
}
function sellIds(ids){
  let tot=0, n=0;
  for(const id of ids){ const v = sellCard(id, true); if(v){ tot+=v; n++; } }
  if(n) toast("Sold "+n+" card"+(n>1?"s":"")+" for "+money(tot));
  return tot;
}

/* ============================================================
   GRADING  (pay a fee, sweat the grade, value multiplies)
   EV of the multiplier ≈ 1.5x, so grading is only +EV on cards
   worth more than ~2x the fee — exactly like the real gamble.
   ============================================================ */
const GRADE_FEE = 15;
const GRADES = [
  { g:"10", label:"GEM MINT 10", p:0.18, mult:3.5,  color:"#ffcb3d" },
  { g:"9",  label:"MINT 9",      p:0.35, mult:1.6,  color:"#39d98a" },
  { g:"8",  label:"NM-MT 8",     p:0.27, mult:0.85, color:"#5ad1ff" },
  { g:"7",  label:"NM 7",        p:0.12, mult:0.5,  color:"#8b97b3" },
  { g:"6",  label:"EX-MT 6",     p:0.05, mult:0.3,  color:"#8b97b3" },
  { g:"AA", label:"ALTERED",     p:0.03, mult:0.2,  color:"#ff5d6c" }
];
function rollGrade(){
  let r = Math.random();
  for(const g of GRADES){ r -= g.p; if(r<=0) return g; }
  return GRADES[GRADES.length-1];
}
function gradeCard(id){
  const c = state.collection.find(x=>x.id===id);
  if(!c || c.grade) return;
  if(state.balance < GRADE_FEE){ toast("Not enough balance — grading costs "+money(GRADE_FEE)); return; }
  document.querySelectorAll(".modal-bg").forEach(m=>m.remove());
  state.balance -= GRADE_FEE; state.spent += GRADE_FEE;
  save(); renderWallet();
  const sub = [c.colorName, c.label, c.serial?("#"+c.serial):null].filter(Boolean).join(" · ");
  const bg = modal(
    '<button class="close ghost" style="float:right">✕</button>'+
    '<h2>💎 Grading</h2>'+
    '<div class="slab">'+
      '<div class="slabhead"><span>RIP CITY GRADING</span><span>fee '+money(GRADE_FEE)+'</span></div>'+
      '<b>'+esc(c.name)+'</b>'+
      '<div style="font-size:12px;color:var(--dim)">'+esc(c.set)+' · '+esc(sub)+'</div>'+
      '<div class="gradeball" id="gball"><span class="spin">💿</span></div>'+
      '<div id="gres" style="font-size:13px;color:var(--dim)">Authenticating…</div>'+
    '</div>'
  );
  setTimeout(()=>{
    const g = rollGrade();
    const old = c.value;
    c.value = Math.max(0.05, Math.round(old*g.mult*100)/100);
    c.grade = g.g; c.gradeLabel = g.label;
    state.pullValue += (c.value - old);
    state.counts.graded = (state.counts.graded||0)+1;
    if(state.best && c.value > state.best.value) state.best = c;
    if(g.g==="10") unlock("gem10");
    save(); renderWallet(); checkAch();
    const ball = bg.querySelector("#gball"), res = bg.querySelector("#gres");
    if(!ball || !res) return;
    ball.innerHTML = '<span style="color:'+g.color+'">'+g.g+'</span>';
    res.innerHTML =
      '<b style="color:'+g.color+'">'+g.label+'</b><br>'+
      money(old)+' → <b style="color:'+(c.value>=old?"var(--good)":"var(--bad)")+'">'+money(c.value)+'</b>'+
      '<div style="margin-top:12px"><button class="primary" id="backColl">Back to Collection</button></div>';
    const b = bg.querySelector("#backColl");
    if(b) b.onclick = ()=>{ bg.remove(); showCollection(); };
    if(g.g==="10") triggerFlash(g.color);
  }, 1600);
}

function unlock(id){
  if(state.ach[id]) return;
  state.ach[id] = 1; save();
  const a = ACH.find(x=>x[0]===id);
  if(a) toast("🏆 "+a[2]+" unlocked — "+a[3]);
}
function checkAch(){
  if(state.packs>=1) unlock("first_pack");
  if(state.counts.auto) unlock("first_auto");
  if(state.counts.rcauto) unlock("rc_auto");
  if(state.best && state.best.value>=100) unlock("hit_100");
  if(state.best && state.best.value>=500) unlock("hit_500");
  if(state.counts.oneofone) unlock("oneofone");
  if(state.counts.legend) unlock("family");
  if(state.packs>=50) unlock("packs_50");
  if(state.packs>=250) unlock("packs_250");
  if((state.sold||0)>=500) unlock("sold_500");
}
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{ if(t.parentNode) t.parentNode.removeChild(t); }, 3300);
}

const WIKI_API = "https://en.wikipedia.org/w/api.php";
// Fetch pageimages thumbnails for up to 50 titles at once (titles joined with |).
function wikiBatchFetch(titles){
  if(typeof fetch !== "function") return Promise.resolve(null);
  const u = WIKI_API + "?action=query&format=json&redirects=1"
          + "&prop=pageimages&piprop=thumbnail&pithumbsize=400&origin=*&titles="
          + titles.map(encodeURIComponent).join("%7C");
  return fetch(u).then(r=> r.ok ? r.json() : null);
}
// Map each requested title → thumbnail URL, following the API's
// normalized (from→to) then redirects (from→to) chains to the final page title.
function wikiThumbMap(j, requestedTitles){
  const out = {};
  const q = j && j.query;
  const normMap = {}, redirMap = {}, pageByTitle = {};
  if(q){
    (q.normalized||[]).forEach(x=>{ normMap[x.from] = x.to; });
    (q.redirects||[]).forEach(x=>{ redirMap[x.from] = x.to; });
    if(q.pages){ for(const k in q.pages){ const pg = q.pages[k];
      if(pg && pg.title!=null) pageByTitle[pg.title] = (pg.thumbnail && pg.thumbnail.source) || ""; } }
  }
  requestedTitles.forEach(t=>{
    let r = t;
    if(normMap[r]!=null) r = normMap[r];
    let guard = 0; while(redirMap[r]!=null && guard++<5){ r = redirMap[r]; }
    out[t] = pageByTitle[r] || pageByTitle[t] || "";
  });
  return out;
}
// Sport-specific disambiguation suffix tried when a bare title misses.
function sportSuffixes(sport){
  if(sport==="basketball") return [" (basketball)"];
  if(sport==="football")   return [" (American football)"];
  if(sport==="baseball")   return [" (baseball)"];
  return [];
}
function poolSport(poolId){ const p = PRODUCTS.find(x=>x.pool===poolId); return p ? p.sport : null; }

// Retry a missed name with disambiguated titles before caching the miss.
function disambiguatePhotoP(name, sport){
  const suffixes = sportSuffixes(sport);
  const attempt = (i)=>{
    if(i>=suffixes.length){ photoMap[name] = ""; savePhotos(); return Promise.resolve(""); }
    const title = name + suffixes[i];
    return wikiBatchFetch([title]).then(j=>{
      const img = wikiThumbMap(j, [title])[title] || "";
      if(img){ photoMap[name] = img; savePhotos(); return img; }
      return attempt(i+1);
    }).catch(()=>{ photoMap[name] = ""; savePhotos(); return ""; });
  };
  return attempt(0);
}

// Batch-prefetch every uncached player photo for a pool (50 titles/request).
function prefetchPoolPhotos(poolId){
  if(state.photos === false) return;
  if(typeof fetch !== "function") return;
  const pool = POOLS[poolId] || [];
  const sport = poolSport(poolId);
  const names = [];
  for(const e of pool){
    const name = e[0];
    if(name in LEGEND_PHOTOS) continue;
    if(name in photoMap) continue;
    if(names.indexOf(name)<0) names.push(name);
  }
  if(!names.length) return;
  for(let i=0;i<names.length;i+=50){
    const batch = names.slice(i, i+50);
    const titleToName = {};
    const titles = batch.map(n=>{ const t = wikiTitle(n); titleToName[t] = n; return t; });
    wikiBatchFetch(titles).then(j=>{
      const map = wikiThumbMap(j, titles);
      const misses = [];
      titles.forEach(t=>{
        const name = titleToName[t];
        const thumb = map[t] || "";
        if(thumb) photoMap[name] = thumb;
        else misses.push(name);           // don't cache "" yet — try disambiguation
      });
      savePhotos();
      misses.forEach(name=> disambiguatePhotoP(name, sport));
    }).catch(()=>{});
  }
}

function ensurePhoto(name, sport){
  if(name in LEGEND_PHOTOS) return Promise.resolve(LEGEND_PHOTOS[name]);
  if(name in photoMap) return Promise.resolve(photoMap[name]);
  if(typeof fetch !== "function"){ return Promise.resolve(""); }
  if(photoPromises[name]) return photoPromises[name];
  // MediaWiki Action API in anonymous-CORS mode (origin=*); redirects=1 resolves
  // accented/alt spellings automatically. Returns an upload.wikimedia.org thumbnail.
  const title = wikiTitle(name);
  photoPromises[name] = wikiBatchFetch([title])
    .then(j=>{
      const img = wikiThumbMap(j, [title])[title] || "";
      if(img){ photoMap[name] = img; savePhotos(); return img; }
      return disambiguatePhotoP(name, sport);   // cache "" only after disambiguation
    })
    .catch(()=>{ delete photoPromises[name]; return ""; }); // network error: allow retry later
  return photoPromises[name];
}

function hydratePhotos(scope){
  if(state.photos === false) return;
  scope.querySelectorAll(".photo[data-player]").forEach(el=>{
    const name = el.getAttribute("data-player");
    const sport = el.getAttribute("data-sport") || null;
    ensurePhoto(name, sport).then(src=>{
      if(src){ el.style.backgroundImage = 'url("'+src+'")'; el.classList.add("has-img"); }
    });
  });
}

function esc(s){ return String(s).replace(/[&<>"']/g, ch=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch])); }
function initials(name){
  const parts = String(name).split(/\s+/).filter(Boolean);
  return ((parts[0]||"")[0]||"") + ((parts[1]||"")[0]||"");
}

// Gold ink for the truly exclusive autos (short serial run ≤10 or top rarity),
// otherwise a blue ballpoint.
function autoSigGold(c){
  if(["gold","superrare","oneofone"].indexOf(c.rarKey)>=0) return true;
  if(c.serial){ const m = /\/(\d+)/.exec(c.serial); if(m && parseInt(m[1],10)<=10) return true; }
  return false;
}

/* ============================================================
   PACK OPENING ANIMATION  → then swipe-stack (pack) or grid (box)
   ============================================================ */
function playPackOpening(prod, cards, isBox, fmt){
  renderToolbar(true); renderWallet();
  // Preload/decode each card's photo now so images are ready before cards flip.
  if(state.photos !== false){
    for(const card of cards){
      ensurePhoto(card.photoKey||card.name, card.sport).then(url=>{ if(url){ new Image().src = url; } });
    }
  }
  const goReveal = ()=> isBox ? showReveal(prod, cards, true, fmt) : showStack(prod, cards, false, fmt);
  rerender = goReveal; // if state changes mid-anim, just land on the reveal
  const grad = "linear-gradient(160deg,"+prod.palette[0]+","+prod.palette[1]+" 60%,"+prod.palette[2]+")";
  view.innerHTML =
    '<div class="opener"><div class="packstage tearstage">'+
      '<div class="tearpack" id="tearpack" style="background:'+grad+'">'+
        '<div class="foilshine"></div>'+
        '<div class="tearlid"><div class="psport">'+prod.sport+'</div></div>'+
        '<div class="tearbody"><div class="pbrand">'+prod.brand+'</div></div>'+
        '<div class="burst"></div>'+
      '</div>'+
      '<div class="hint" id="tearhint">Ripping…</div>'+
    '</div></div>';
  const tp = byId("tearpack");
  // let the user skip the animation by tapping
  tp.onclick = ()=>{ done(); };
  let finished = false;
  function done(){ if(finished) return; finished = true; goReveal(); }
  requestAnimationFrame(()=>{ tp.classList.add("go"); });
  setTimeout(done, 1200);
}

/* ---- Swipe-to-reveal stack (single pack) ---------------------------------- */
function showStack(prod, cards, isBox, fmt){
  fmt = fmt || getFormat(prod, "hobby");
  renderToolbar(true); renderWallet();
  rerender = ()=>showStack(prod, cards, isBox, fmt);
  const total = cards.length;
  view.innerHTML =
    '<div class="opener">'+
      '<div class="opener-head"><div class="ptitle"><h2>'+prod.name+'</h2>'+
        '<div class="sub">Swipe → (or tap Next) to reveal each card</div></div>'+
        '<button id="toGrid">▦ View all</button></div>'+
      '<div class="packstage stackstage">'+
        '<div class="swipewrap" id="swipe">'+ cards.map(cardFrontHTML).join("") +'</div>'+
        '<div class="swipehint" id="swipehint">← swipe →</div>'+
        '<div class="stackbar" id="stackbar">'+
          '<button class="ghost" id="prevC">‹ Back</button>'+
          '<div class="stackcount"><b id="cidx">1</b> <span>/ '+total+'</span></div>'+
          '<button class="primary" id="nextC">Next ›</button>'+
        '</div>'+
        '<div class="pull-summary" id="stacksum" style="display:none"></div>'+
        '<div class="ripcontrols" id="stackdone" style="display:none;margin-top:14px">'+
          '<button class="primary" id="againS">RIP ANOTHER · '+money(fmt.packPrice)+'</button>'+
          '<button id="backS">Other Products</button>'+
        '</div>'+
      '</div>'+
    '</div>';

  const wrap = byId("swipe");
  hydratePhotos(wrap);
  const els = Array.from(wrap.querySelectorAll(".card"));
  let idx = 0, dragging = false, startX = 0, dx = 0;

  function layout(){
    els.forEach((el,i)=>{
      const d = i - idx;
      el.style.transition = "transform .35s cubic-bezier(.2,.8,.2,1), opacity .3s ease";
      if(d < 0){            // already swiped away (to the right)
        el.style.transform = "translateX(135%) rotate(14deg)";
        el.style.opacity = "0"; el.style.pointerEvents = "none"; el.style.zIndex = 0;
      } else if(d === 0){   // active
        el.style.transform = "translateX(0) rotate(0)";
        el.style.opacity = "1"; el.style.pointerEvents = "auto"; el.style.zIndex = 30;
      } else if(d <= 2){    // peeking behind
        el.style.transform = "translateY("+(d*9)+"px) scale("+(1 - d*0.045)+")";
        el.style.opacity = "1"; el.style.pointerEvents = "none"; el.style.zIndex = 30 - d;
      } else {              // hidden deep in the deck
        el.style.transform = "translateY(20px) scale(.9)";
        el.style.opacity = "0"; el.style.pointerEvents = "none"; el.style.zIndex = 0;
      }
    });
  }
  function revealActive(){
    const el = els[idx]; if(!el) return;
    if(!el.classList.contains("flipped")){
      setTimeout(()=>{ revealCard(el, cards[idx]); }, 150);
    }
  }
  function setIdx(i){
    idx = Math.max(0, Math.min(total, i));
    byId("cidx").textContent = Math.min(idx+1, total);
    if(idx >= total){ finish(); return; }
    layout(); revealActive();
  }
  function next(){ if(idx >= total-1){ setIdx(total); } else { setIdx(idx+1); } }
  function prev(){ if(idx > 0) setIdx(idx-1); }

  function finish(){
    byId("stackbar").style.display = "none";
    byId("swipehint").style.display = "none";
    const packVal = cards.reduce((s,c)=>s+c.value,0);
    const hits = cards.filter(c=>c.isHit).length;
    const cost = fmt.packPrice, profit = packVal - cost;
    const sum = byId("stacksum");
    sum.style.display = "block";
    sum.innerHTML =
      '<div class="row"><span>Cards revealed</span><b>'+total+'</b></div>'+
      '<div class="row"><span>Hits</span><b>'+hits+'</b></div>'+
      '<div class="row"><span>Est. pull value</span><b>'+money(packVal)+'</b></div>'+
      '<div class="row"><span>Cost</span><b>'+money(cost)+'</b></div>'+
      '<div class="row"><span>This pack</span><b class="'+(profit>=0?"pos":"neg")+'">'+(profit>=0?"+":"")+money(profit)+'</b></div>';
    byId("stackdone").style.display = "flex";
    const hitIds = cards.filter(c=>c.colId).map(c=>c.colId);
    if(hitIds.length){
      const hv = cards.filter(c=>c.isHit).reduce((s,c)=>s+c.value,0);
      byId("stackdone").insertAdjacentHTML("afterbegin",
        '<button id="sellHitsS">💰 Sell hits · '+money(hv)+'</button>');
      byId("sellHitsS").onclick = function(){
        sellIds(hitIds);
        this.disabled = true; this.textContent = "Sold ✓";
      };
    }
    renderWallet();
  }

  // pointer / touch drag on the active card.
  // usedTouch guard: iOS fires synthetic mouse events (mousedown/up/click)
  // ~300ms after every tap — without the guard one tap advanced TWICE.
  let usedTouch = false;
  function onDown(e){
    if(e.type==="mousedown" && usedTouch) return;
    if(e.touches) usedTouch = true;
    if(idx >= total) return;
    const p = e.touches ? e.touches[0] : e;
    dragging = true; startX = p.clientX; dx = 0;
    const el = els[idx]; if(el) el.style.transition = "none";
  }
  function onMove(e){
    if(e.type==="mousemove" && usedTouch) return;
    if(!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    dx = p.clientX - startX;
    const el = els[idx]; if(el) el.style.transform = "translateX("+dx+"px) rotate("+(dx*0.05)+"deg)";
  }
  function onUp(e){
    if(e && e.type==="mouseup" && usedTouch) return;
    if(!dragging) return; dragging = false;
    if(dx > 70){ next(); }
    else if(dx < -70){ prev(); }
    else if(Math.abs(dx) < 6){
      // tap: flip the active card if it's face-down, otherwise advance
      const el = els[idx];
      if(el && !el.classList.contains("flipped")){ revealCard(el, cards[idx]); layout(); }
      else next();
    }
    else { layout(); }  // half-swipe: snap back
  }
  // tear down any drag listeners left by a previous stack, then wire fresh ones
  if(window._stackCleanup) window._stackCleanup();
  wrap.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  wrap.addEventListener("touchstart", onDown, {passive:true});
  wrap.addEventListener("touchmove", onMove, {passive:true});
  wrap.addEventListener("touchend", onUp);
  window._stackCleanup = function(){
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
    window._stackCleanup = null;
  };

  byId("nextC").onclick = next;
  byId("prevC").onclick = prev;
  byId("toGrid").onclick = ()=> showReveal(prod, cards, isBox, fmt);
  byId("againS").onclick = ()=>{ if(state.balance>=fmt.packPrice){ doRip(prod, fmt);} else { renderOpener(prod.id, fmt.key); } };
  byId("backS").onclick = ()=> renderOpener(prod.id, fmt.key);

  // deal the fresh pack up into the stack, then flip the first card
  els.forEach(el=>{
    el.style.transition = "none";
    el.style.transform = "translateY(340px) rotate(6deg)";
    el.style.opacity = "0";
  });
  requestAnimationFrame(()=>requestAnimationFrame(layout));
  setTimeout(revealActive, 480);
}

  const packVal = cards.reduce((s,c)=>s+c.value,0);
  const cost = isBox ? fmt.packPrice*fmt.packs : fmt.packPrice;
  const profit = packVal - cost;

  let html = '<div class="opener">'+

      '<div class="ripcontrols" style="margin-top:14px">'+
        '<button class="primary" id="again">RIP ANOTHER · '+money(fmt.packPrice)+'</button>'+
        (hits.length ? '<button id="sellHits">💰 Sell hits · '+money(hits.reduce((s,c)=>s+c.value,0))+'</button>' : '')+
        '<button id="backToList">Other Products</button>'+
      '</div>'+
    '</div>'+
  '</div>';
  view.innerHTML = html;
  const shBtn = byId("sellHits");
  if(shBtn) shBtn.onclick = function(){
    sellIds(cards.filter(c=>c.colId).map(c=>c.colId));
    this.disabled = true; this.textContent = "Sold ✓";
  };

  const revealEl = byId("reveal");
  hydratePhotos(revealEl);
  const cardEls = Array.from(revealEl.children);
  cardEls.forEach((el,i)=>{
    el.classList.add("dealin");
    el.style.animationDelay = Math.min(i*35, 1200)+"ms";
    el.onclick = ()=> revealCard(el, cards[i]);
  });
  byId("flipAll").onclick = ()=>{
    // cascade the flips; big hits fire their own flash/sparks mid-flip
    cardEls.forEach((el,i)=>{
      setTimeout(()=>revealCard(el, cards[i]), Math.min(i*90, 3000));
    });
  };
  byId("again").onclick = ()=>{ if(state.balance>=fmt.packPrice){ doRip(prod, fmt);} else { renderOpener(prod.id, fmt.key); } };
  byId("backToList").onclick = ()=> renderOpener(prod.id, fmt.key);

  renderWallet();
}

function triggerFlash(color){
  const f = byId("flash");
  f.style.background = "radial-gradient(circle at 50% 40%,"+color+"66,transparent 60%)";
  f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
}

/* ============================================================
   CARD ANIMATION ENGINE
   revealCard: rarity-aware flip (big hits flip slow, spark burst
   at mid-flip, monsters shake the screen). attachTilt: pointer-
   tracked 3D tilt + glare on any flipped card.
   ============================================================ */
function sparkBurst(el, color, n){
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for(let i=0;i<n;i++){
    const s = document.createElement("div");
    s.className = "spark";
    const a = Math.random()*Math.PI*2, d = 60 + Math.random()*140;
    s.style.left = cx+"px"; s.style.top = cy+"px";
    s.style.setProperty("--dx", (Math.cos(a)*d)+"px");
    s.style.setProperty("--dy", (Math.sin(a)*d - 50)+"px");
    s.style.background = Math.random()<0.5 ? color : "#fff";
    s.style.animationDelay = (Math.random()*0.12)+"s";
    document.body.appendChild(s);
    setTimeout(()=>{ if(s.parentNode) s.parentNode.removeChild(s); }, 1200);
  }
}

function revealCard(el, c){
  if(!el || el.classList.contains("flipped")) return;
  const monster = c && (c.value>=500 || c.rarKey==="oneofone");
  if(c && c.big){
    el.classList.add("bigflip");
    el.classList.add("flipped");
    setTimeout(()=>{
      triggerFlash(c.color);
      sparkBurst(el, c.color, monster ? 38 : 20);
      if(monster){
        const w = document.querySelector(".wrap");
        if(w){ w.classList.add("shake"); setTimeout(()=>w.classList.remove("shake"), 650); }
      }
      try{ if(navigator.vibrate) navigator.vibrate(monster ? [60,40,90] : 40); }catch(e){}
    }, 560); // mid-flip of the slow rotation
  } else {
    el.classList.add("flipped");
  }
  attachTilt(el);
}

function attachTilt(el){
  if(el._tilt) return; el._tilt = true;
  const inner = el.querySelector(".inner");
  const glare = el.querySelector(".glare");
  if(!inner) return;
  function move(e){
    if(!el.classList.contains("flipped")) return;
    const p = e.touches ? e.touches[0] : e;
    const r = el.getBoundingClientRect();
    if(!r.width) return;
    const x = (p.clientX - r.left)/r.width  - 0.5;
    const y = (p.clientY - r.top )/r.height - 0.5;
    inner.style.transition = "transform .08s ease";
    inner.style.transform = "rotateY("+(180 - x*22)+"deg) rotateX("+(y*16)+"deg)";
    if(glare){
      glare.style.opacity = 0.6;
      glare.style.backgroundPosition = (50 + x*100)+"% "+(50 + y*100)+"%";
    }
  }
  function leave(){
    inner.style.transition = "transform .45s ease";
    inner.style.transform = "";
    if(glare) glare.style.opacity = 0;
  }
  el.addEventListener("mousemove", move);
  el.addEventListener("mouseleave", leave);
  el.addEventListener("touchmove", move, {passive:true});
  el.addEventListener("touchend", leave);
}

/* ============================================================
   ODDS MODAL
   ============================================================ */
function modal(html){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = '<div class="modal">'+html+'</div>';
  bg.onclick = (e)=>{ if(e.target===bg) document.body.removeChild(bg); };
  document.body.appendChild(bg);
  const c = bg.querySelector(".close"); if(c) c.onclick = ()=>document.body.removeChild(bg);
  return bg;
}

function odds1in(p){
  if(p>=1) return "1 : 1";
  const x = Math.round(1/p);
  return "1 : " + x.toLocaleString();
}

function showOdds(prod, fmt){
  fmt = fmt || getFormat(prod, "hobby");
  let rows = '<tr><th>Type</th><th class="r">Approx. odds</th></tr>';
  rows += '<tr><td><span class="swatch" style="background:'+RAR.base.color+'"></span>Base / Common</td><td class="r">most cards</td></tr>';
  for(const c of prod.chase){
    const r = RAR[c.rar];
    const p = c.p * (c.rar==="auto" ? fmt.autoMult : fmt.oddsMult);
    let extra = "";
    if(c.runs) extra = ' <span style="color:var(--dim)">('+c.runs.map(x=>"/"+x).join(", ")+')</span>';
    rows += '<tr><td><span class="swatch" style="background:'+r.color+'"></span>'+c.label+extra+'</td><td class="r">'+odds1in(p)+' packs</td></tr>';
  }
  if(fmt.excl){
    const r = RAR[fmt.excl.rar];
    rows += '<tr><td><span class="swatch" style="background:'+r.color+'"></span>⭐ '+fmt.excl.label+
      (fmt.excl.runs?' <span style="color:var(--dim)">('+fmt.excl.runs.map(x=>"/"+x).join(", ")+')</span>':'')+
      ' <b style="color:var(--accent)">'+fmt.label+' Exclusive</b></td><td class="r">'+odds1in(fmt.excl.p)+' packs</td></tr>';
  }
  rows += '<tr><td><span class="swatch" style="background:'+RAR.legend.color+'"></span>🟢 RIP City Legends (Graham Family) <span style="color:var(--dim)">(/10, /5, 1/1)</span></td><td class="r">'+odds1in(fmt.legendP)+' packs</td></tr>';

  // which cards are locked to which box
  const exclList = Object.keys(BOX_TYPES).map(k=>{
    const f = getFormat(prod, k);
    return '<div style="padding:4px 0">'+f.icon+' <b>'+f.label+'</b> — '+f.packs+' packs × '+f.cpp+' cards · '+money(f.packPrice)+'/pk'+
      (f.excl ? ' · <span style="color:var(--accent)">Exclusive: '+f.excl.label+(f.excl.runs?' /'+f.excl.runs[0]:'')+'</span>' : '')+
      ' · autos '+odds1in( (prod.chase.find(c=>c.rar==="auto")||{p:0.01}).p * f.autoMult )+'</div>';
  }).join("");

  modal(
    '<button class="close ghost" style="float:right">✕</button>'+
    '<h2>'+prod.name+' — '+fmt.icon+' '+fmt.label+' Odds</h2>'+
    '<div style="color:var(--dim);font-size:13px">'+prod.year+' • '+fmt.cpp+' cards/pack • '+fmt.packs+' packs/box • '+money(fmt.packPrice)+'/pack</div>'+
    '<table class="odds">'+rows+'</table>'+
    '<h3 style="font-size:14px;margin:16px 0 4px">📦 Box types & exclusives</h3>'+
    '<div style="font-size:12.5px;color:var(--fg)">'+exclList+'</div>'+
    '<p style="color:var(--dim);font-size:12px;margin-top:12px">Odds are modeled on published hobby/retail configurations and rounded for simulation. Retail (Mega/Blaster) has slimmer chase odds but box-exclusive parallels.</p>'
  );
}

/* ============================================================
   COLLECTION MODAL
   ============================================================ */
let collFilter = "all", collSort = "value";
function collMatches(c){
  switch(collFilter){
    case "auto":   return !!c.auto;
    case "rookie": return !!c.rookie || !!c.firstBowman;
    case "graded": return !!c.grade;
    case "big":    return c.value >= 50;
    default:       return true;
  }
}
function gradeChipHTML(c){
  if(!c.grade) return "";
  const col = c.grade==="10" ? "#ffcb3d" : (c.grade==="9" ? "#39d98a" : (c.grade==="AA" ? "#ff5d6c" : "#8b97b3"));
  const txt = c.grade==="AA" ? "ALTERED" : "GRADE "+c.grade;
  return '<span class="gradechip" style="color:'+col+';border-color:'+col+'66;background:'+col+'18">'+txt+'</span>';
}
function showCollection(){
  const bg = modal(
    '<button class="close ghost" style="float:right">✕</button>'+
    '<h2>📒 My Collection</h2><div id="collbody"></div>'
  );
  renderCollBody(bg);
}
function renderCollBody(bg){
  const body = bg.querySelector("#collbody");
  if(!body) return;
  const coll = state.collection.filter(collMatches).slice();
  if(collSort==="value") coll.sort((a,b)=> b.value - a.value);
  else coll.sort((a,b)=> (b.id||0) - (a.id||0));

  const chips = [["all","All"],["auto","✍️ Autos"],["rookie","RC"],["graded","💎 Graded"],["big","$50+"]];
  let html = '<div class="chiprow">'+
    chips.map(([k,l])=>'<span class="chip'+(collFilter===k?" on":"")+'" data-f="'+k+'">'+l+'</span>').join("")+
    '<span style="flex:1"></span>'+
    '<span class="chip'+(collSort==="value"?" on":"")+'" data-s="value">Top value</span>'+
    '<span class="chip'+(collSort==="new"?" on":"")+'" data-s="new">Newest</span>'+
  '</div>';

  if(!state.collection.length){
    html += '<div class="empty">No hits yet. Rip some packs! Base cards aren’t tracked — only parallels, inserts, numbered, and autos land in your binder.</div>';
  } else if(!coll.length){
    html += '<div class="empty">Nothing matches this filter.</div>';
  } else {
    const totalVal = state.collection.reduce((s,c)=>s+c.value,0);
    html += '<div style="color:var(--dim);font-size:13px;margin:6px 0">'+
      state.collection.length+' hits · est. '+money(totalVal)+
      (state.best?' · best: '+esc(state.best.name)+' '+money(state.best.value):'')+
      ' · 💎 grading costs '+money(GRADE_FEE)+'</div><div class="colllist">';
    for(const c of coll){
      const sub = [c.colorName, c.label, c.serial?("#"+c.serial):null, c.auto?"AUTO":null, c.firstBowman?"1st Bowman":null].filter(Boolean).join(" · ");
      html += '<div class="collrow">'+
        '<div class="cl-rar" style="background:'+c.color+'"></div>'+
        '<div class="photo clthumb" data-player="'+esc(c.photoKey||c.name)+'" data-sport="'+esc(c.sport||"")+'" style="background-image:'+cardGrad(c)+'"><span>'+initials(c.name)+'</span></div>'+
        '<div class="cl-main"><div class="cl-nm">'+esc(c.name)+gradeChipHTML(c)+' <span style="color:var(--dim);font-weight:400">'+esc(c.team)+'</span></div>'+
        '<div class="cl-sub">'+esc(c.set)+' '+c.year+' · '+esc(sub)+'</div></div>'+
        '<div class="cl-side"><div class="cl-val">'+money(c.value)+'</div>'+
          '<div class="collbtns">'+
            (!c.grade ? '<button data-g="'+c.id+'">💎 Grade</button>' : '')+
            '<button data-sell="'+c.id+'">💰 Sell</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    }
    html += '</div>';
  }
  body.innerHTML = html;
  body.querySelectorAll(".chip[data-f]").forEach(el=>{ el.onclick = ()=>{ collFilter = el.dataset.f; renderCollBody(bg); }; });
  body.querySelectorAll(".chip[data-s]").forEach(el=>{ el.onclick = ()=>{ collSort = el.dataset.s; renderCollBody(bg); }; });
  body.querySelectorAll("[data-sell]").forEach(el=>{ el.onclick = ()=>{ sellCard(+el.dataset.sell); renderCollBody(bg); }; });
  body.querySelectorAll("[data-g]").forEach(el=>{ el.onclick = ()=>{ gradeCard(+el.dataset.g); }; });
  hydratePhotos(body);
}

   STATS + ACHIEVEMENTS MODAL
   ============================================================ */

  const n = state.counts || {};
  const numbered = (n.numbered||0)+(n.rare||0)+(n.gold||0)+(n.superrare||0);
  const net = state.pullValue - state.spent;
  const sb = (l,v)=>'<div class="stat"><small>'+l+'</small><b>'+v+'</b></div>';
  modal(
    '<button class="close ghost" style="float:right">✕</button>'+
    '<h2>📈 Career Stats</h2>'+
    '<div class="statgrid">'+
      sb("Packs ripped", state.packs)+
      sb("Total spent", money(state.spent))+
      sb("Value pulled", money(state.pullValue))+
      sb("Cards sold", money(state.sold||0))+
      '<div class="stat net '+(net>=0?"pos":"neg")+'"><small>Net</small><b>'+(net>=0?"+":"")+money(net)+'</b></div>'+
      sb("Hits", n.hits||0)+
      sb("Autographs", n.auto||0)+
      sb("Numbered", numbered)+
      sb("1/1s", n.oneofone||0)+
      sb("Graded", n.graded||0)+
    '</div>'+

      ? '<div style="margin-top:12px;font-size:13px;color:var(--dim)">Best pull: <b style="color:var(--fg)">'+esc(state.best.name)+'</b>'+
        (state.best.label?' · '+esc(state.best.label):'')+
        ' · <span style="color:var(--accent);font-weight:800">'+money(state.best.value)+'</span></div>'
      : '')+
    '<h3 style="margin:18px 0 0;font-size:15px">🏆 Achievements ('+Object.keys(state.ach||{}).length+'/'+ACH.length+')</h3>'+
    '<div class="achgrid">'+
      ACH.map(a=>'<div class="ach'+(state.ach[a[0]]?"":" locked")+'"><b>'+a[1]+' '+a[2]+'</b>'+a[3]+'</div>').join("")+
    '</div>'
  );
}
